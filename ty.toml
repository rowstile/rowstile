# The Python here is strongly typed: ty checks the types, and Ruff (ruff.toml) that every function says them.
# From the repository's root, as CI's `unit` job does:
#   uvx ty@0.0.56 check && uvx ruff@0.15.12 check
# The command runs on Python 3.11 or newer, standard library only: annotations use nothing else.
[environment]
python-version = "3.11"
extra-paths = ["core", "core/cli", "core/mutants", "packaging", "packaging/npm", "docs", "examples"]

# the standard-library code; what needs packages has its own settings (sdk/python, integrations/fastapi, examples/*)
[src]
include = ["core/authzlib", "core/cli", "core/compile_policy.py", "core/tests", "core/bench", "core/mutants", "packaging/version.py", "packaging/changelog.py", "packaging/npm/platforms.py", "docs/llms_full.py", "docs/compare_readings.py", "review-ci/github/comment.py", "examples/public_surface.py"]
[rules]
all = "error"
# typing.override is Python 3.12's, and the command runs on 3.11 with the standard library only
missing-override-decorator = "ignore"
