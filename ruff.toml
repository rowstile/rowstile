# Ruff lints and formats every Python file here (CI's `unit` job: uvx ruff@0.15.12 check, then
# uvx ruff@0.15.12 format --check), and with ty (ty.toml) keeps the Python strongly typed: ANN asks for every
# argument's and result's type. `uvx ruff@0.15.12 format` before a commit lays the code out.
target-version = "py311"
line-length = 120

[lint]
select = [
    "E", "W", "F",      # pycodestyle, pyflakes
    "B",                # bugbear: likely bugs
    "UP",               # the syntax of Python 3.11
    "I",                # sorted imports
    "RUF", "SIM", "C4", "PIE",
    "ANN",              # annotations everywhere
]
ignore = [
    "E501",             # the formatter keeps lines to 120; a long string or comment is left as written
    "E731",             # a lambda may be named
    "RUF005",           # a + [b] reads as well as [*a, b]
    "SIM105",           # try/except/pass reads as well as contextlib.suppress
]

[lint.per-file-ignores]
# Django's migrations are classes whose lists Django reads: as makemigrations and rowstile migrate write them
"integrations/django/app/migrations/*.py" = ["RUF012"]

[lint.flake8-bugbear]
# FastAPI's dependencies are declared as default values
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Cookie", "fastapi.File",
                          "fastapi.Form", "fastapi.Body", "fastapi.Path"]

[format]
# what the command writes is left as it writes it: the apps' generated clients (their tests fail when one
# differs from what `rowstile client` gives) and the Alembic revisions `rowstile migrate` made
exclude = ["**/authz_client.py", "integrations/fastapi/migrations/versions/*_authz_*.py"]
