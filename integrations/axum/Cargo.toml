[package]
name = "rowstile-conformance-axum"
version = "0.0.0"
edition = "2024"
publish = false
description = "The Rust SDK's conformance suite: an Axum app on sqlx, its migrations sqlx's"

[lib]
name = "conformance"

# the app's server (src/bin has the migrator)
[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
rowstile = { path = "../../sdk/rust", version = "0.1.0-dev", features = ["sqlx", "axum"] }
axum = "0.8.4"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate"] }
tokio = { version = "1.44.0", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tracing-subscriber = "0.3.19"

[dev-dependencies]
rowstile = { path = "../../sdk/rust", version = "0.1.0-dev", features = ["testing"] }
tokio-postgres = "0.7.13"
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
