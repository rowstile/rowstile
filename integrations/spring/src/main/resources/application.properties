# The app connects as the role the policy names (conf_app), which row-level security applies to
spring.datasource.url=${ROWSTILE_APP_URL}
spring.datasource.hikari.maximum-pool-size=${PG_POOL_MAX:5}
# Flyway migrates as the tables' owner, on a connection of its own (the policy is one of the migrations)
spring.flyway.url=${ROWSTILE_OWNER_URL}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
