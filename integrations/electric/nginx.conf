# A shared cache in front of the app (test.sh fills in the ports), as a CDN in front of Electric's proxy would be:
# it keeps what the answers' cache-control lets it keep, a copy for each value of the request headers they vary on,
# and says whether it answered from its copy (x-cache: HIT).
worker_processes 1;
pid /tmp/nginx.pid;
events {}
http {
  access_log off;
  proxy_cache_path /tmp/shapes levels=1 keys_zone=shapes:1m max_size=50m inactive=10m use_temp_path=off;
  server {
    listen 127.0.0.1:@PORT@;
    location / {
      proxy_pass http://127.0.0.1:@APP@;
      proxy_http_version 1.1;
      proxy_cache shapes;
      proxy_cache_key $request_uri;
      proxy_buffering on;
      add_header x-cache $upstream_cache_status always;
    }
  }
}
