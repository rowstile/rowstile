[project]
name = "rowstile-conformance-fastapi"
version = "0.0.0"
description = "The Python SDK's conformance suite: a small FastAPI app on SQLAlchemy (async, asyncpg), migrated with Alembic"
requires-python = ">=3.11"
dependencies = [
  "rowstile[fastapi,sqlalchemy,psycopg,asyncpg]",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.1.4",
  "alembic>=1.13",
  "fastapi>=0.110",
  "httpx>=0.27",
  "pytest>=8",
  "mypy>=1.10",
  "coverage>=7.16",
  # the background jobs' workers (tests/test_jobs.py), and Celery's types, which it doesn't ship
  "celery[redis]>=5.6",
  # redis-py before 6.4 (the oldest Celery that takes it is 5.6) locks its pub/sub connection with a plain Lock: a
  # result's __del__ that runs while get() subscribes, in the same thread, waits for it forever (the checks wait
  # for results in threads)
  "redis>=6.4",
  "celery-types>=0.26",
  "rq>=2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
rowstile = {path = "../../sdk/python", editable = true}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# What the checks run of the SDK (sdk/python/rowstile), lines and branches. test.sh has every Python process it
# starts measure itself, the tests' own subprocesses too (coverage's .pth file reads COVERAGE_PROCESS_START), then
# combines them, prints the report and fails below 100%
[tool.coverage.run]
branch = true
parallel = true
source_pkgs = ["rowstile"]
# not the command's Postgres client, which rowstile.testing loads as rowstile._pgwire (core's suites measure it), nor
# the Django module (the Django suite measures it: integrations/django)
omit = ["*/core/cli/*", "*/rowstile/django/*"]
# SQLAlchemy's async engine runs the driver's calls in greenlets
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
fail_under = 100
# what only the type checker reads
exclude_also = ["if TYPE_CHECKING:"]
partial_branches = ["if not TYPE_CHECKING:"]

# strongly typed, as the repository's Python (ty.toml): uv sync, then uvx ty@0.0.56 check --project integrations/fastapi
[tool.ty.environment]
python-version = "3.11"
python = ".venv"

[tool.ty.rules]
all = "error"
missing-override-decorator = "ignore"
