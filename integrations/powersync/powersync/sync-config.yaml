# Generated by rowstile client from the policy. Do not edit; re-run after changing the policy or a mirrored table.
# PowerSync's streams of the tables the policy mirrors (a preview), for the service's sync config: each row of a
# mirror in the bucket of each key that may read it (a bucket for each key the principal holds), for the principal
# the token names: its sub, and the claim principal_type (user if it has none). Never readers, nor a column the
# policy masks (the mirror has none). The service reads the publication powersync: the mirrors and authz_sync.keys.
config:
  edition: 3
streams:
  files:
    auto_subscribe: true
    query: |
      SELECT files."id", files."folder_id", files."owner_id", files."name", files."confidential"
      FROM authz_sync."file__mirror" files, json_each(files.readers) r
      WHERE r.value IN (SELECT key FROM authz_sync.keys
                        WHERE principal_type = ifnull(auth.parameter('principal_type'), 'user')
                          AND principal_id = auth.user_id())
  folders:
    auto_subscribe: true
    query: |
      SELECT folders."id", folders."parent_id", folders."owner_id", folders."name"
      FROM authz_sync."folder__mirror" folders, json_each(folders.readers) r
      WHERE r.value IN (SELECT key FROM authz_sync.keys
                        WHERE principal_type = ifnull(auth.parameter('principal_type'), 'user')
                          AND principal_id = auth.user_id())
  notes:
    auto_subscribe: true
    query: |
      SELECT notes."id", notes."file_id", notes."author_id"
      FROM authz_sync."note__mirror" notes, json_each(notes.readers) r
      WHERE r.value IN (SELECT key FROM authz_sync.keys
                        WHERE principal_type = ifnull(auth.parameter('principal_type'), 'user')
                          AND principal_id = auth.user_id())
