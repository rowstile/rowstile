# rowstile review for GitHub pull requests: one comment, updated in place, that says what the
# policy change does (meaning, access, risk, tests, deploy), and a warning on each policy line it flags.
#
#   on: pull_request
#   permissions: {contents: read, pull-requests: write}   # pull-requests: write posts the comment
#   ...
#   - uses: actions/checkout@v7
#     with: {fetch-depth: 0}                      # the base branch's policy is read with git
#   - uses: rowstile/rowstile/review-ci/github@v0.1.0-beta.1
#     with:
#       database-url: ${{ env.REVIEW_DATABASE_URL }}   # optional: the base branch's migrations and review data
#
# The review reads the base's policy, the files it includes, its tests and its lock file with git: check out the
# whole history (fetch-depth: 0), with no filter. Where git can't read one of them there, the review stops,
# exit 2, and says which, rather than review the policy as new.
#
# Access and the tests' results need a database at the base branch's state (its migrations, then the review
# data); prepare one in the steps before (a Postgres service, your migration tool) and pass its URL. Without
# one, the review says what changes in meaning, risk, tests and deploy, and leaves Access out.
#
# On a pull request from a fork, GitHub gives the workflow a read-only token, whatever its permissions ask for: the
# review is then in the run's summary, with a notice, and not in a comment. A review longer than a comment may be is
# cut, and the comment says the rest is in the run's summary.
#
# The command comes from PyPI, the release the action's tag names; `version` picks another.
name: rowstile review
description: Says in the pull request what a rowstile policy change does
inputs:
  version:
    description: the rowstile release to review with (PyPI), or `source` for the repository that holds this action
    default: "0.1.0-beta.1"
  base:
    description: the commit to compare with (default the pull request's base)
    default: ""
  database-url:
    description: a database at the base branch's state, with the review data (for Access and tests)
    default: ""
  working-directory:
    description: where rowstile.toml is
    default: "."
  comment:
    description: post (or update) the comment on the pull request
    default: "true"
  github-token:
    description: a token that may comment on pull requests
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
      with:
        python-version: "3.12"
    - name: install
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [ "$VERSION" = source ]; then
          python3 -m pip install -q "$GITHUB_ACTION_PATH/../../sdk/python"
        else
          python3 -m pip install -q "rowstile==$VERSION"
        fi
    - name: review
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
        DATABASE: ${{ inputs.database-url }}
      run: |
        set -o pipefail
        db=()
        [ -n "$DATABASE" ] && db=(--db "$DATABASE")
        # one review: the comment to a file, each flag on its policy line (in the pull request's files) to the log
        rowstile "${db[@]}" review --base "$BASE" --annotations --out "$RUNNER_TEMP/rowstile-review.md"
        cat "$RUNNER_TEMP/rowstile-review.md" >> "$GITHUB_STEP_SUMMARY"
    - name: comment
      if: inputs.comment == 'true' && github.event.pull_request.number
      shell: bash
      env:
        TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        # a pull request from a fork gets a read-only token: the review stays in the run's summary
        FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
      run: python3 "$GITHUB_ACTION_PATH/comment.py"
