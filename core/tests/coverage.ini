# coverage.py's settings when run_tests.sh measures what the suites run (ROWSTILE_COVERAGE, in the image
# core/Dockerfile builds with COVERAGE=1; core/ci.sh --coverage does both). Every Python process the suites start
# measures the lines and branches of authzlib and cli it runs, each marked with the step of run_tests.sh that ran
# it, and writes them under ROWSTILE_COVERAGE; tests/coverage_report.py combines them and says what nothing runs.
[run]
branch = True
parallel = True
data_file = ${ROWSTILE_COVERAGE}/data/.coverage
context = ${ROWSTILE_COVERAGE_CONTEXT}
source =
    ${ROWSTILE_COVERAGE_CODE}/authzlib
    ${ROWSTILE_COVERAGE_CODE}/cli

[report]
# never run, by design: what only the type checker reads (and a protocol's methods, whose bodies are `...`), the
# case of a match the type checker proves no value reaches (`case _:` then `assert_never`), the compiler's methods
# that another part of it (a mixin) defines, and a block marked "(Windows only)": CI runs Linux, and the unit tests
# run it on Windows
exclude_also =
    if TYPE_CHECKING:
    case _:\n\s*assert_never\(
    raise NotImplementedError
    ^\s*\.\.\.\s*$
    \(Windows only\)
