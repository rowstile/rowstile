[project]
name = "filemanager"
version = "0.1.0"
description = "A file manager on rowstile: FastAPI, Postgres with rowstile, RustFS for file contents"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.161.1",
  "uvicorn[standard]>=0.54.0",
  "psycopg[binary]>=3.3.6",
  "psycopg-pool>=3.2",
  "boto3>=1.43.118",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
