# The file manager and what it needs: Postgres with the rowstile command (built from this repository), RustFS for
# file contents, and the app.
#   docker compose up -d --build            # everything; the app on http://localhost:8000
#   docker compose up -d db storage         # just the services, for running the backend on the host
services:
  db:
    build: {context: ../.., dockerfile: core/Dockerfile, args: {PG_MAJOR: "16"}}
    image: rowstile:16
    environment: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: filemanager}
    ports: ["25432:5432"]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "postgres", "-d", "filemanager"], interval: 2s, retries: 30}
  storage:
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    environment: {RUSTFS_ACCESS_KEY: rustfsadmin, RUSTFS_SECRET_KEY: rustfsadmin}
    ports: ["29000:9000"]
    volumes: [files:/data]
    # the app makes its bucket at start: it waits until RustFS answers, not only until it has started
    healthcheck: {test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/health"], interval: 2s, retries: 30}
  app:
    build: {context: ../.., dockerfile: examples/filemanager/backend/Dockerfile}
    depends_on: {db: {condition: service_healthy}, storage: {condition: service_healthy}}
    environment:
      FM_ADMIN_URL: postgresql://postgres:postgres@db:5432/filemanager
      FM_APP_PASSWORD: fm_app
      FM_DATABASE_URL: postgresql://fm_app:fm_app@db:5432/filemanager
      FM_S3_ENDPOINT: http://storage:9000
      FM_S3_PUBLIC_ENDPOINT: http://localhost:29000
    ports: ["8000:8000"]
volumes: {db: {}, files: {}}
