# strongly typed, as the repository's Python (ty.toml at its root), in the backend's environment:
#   uv sync --project examples/filemanager/backend && uvx ty@0.0.56 check --project examples/filemanager
[src]
include = ["backend/app", "backend/tests", "db", "check_public_surface.py"]

[environment]
python-version = "3.12"
python = "backend/.venv"
extra-paths = ["backend", ".."]

[rules]
all = "error"
missing-override-decorator = "ignore"
