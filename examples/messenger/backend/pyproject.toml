[project]
name = "messenger"
version = "0.1.0"
description = "A messenger on rowstile: FastAPI, Postgres with rowstile, live updates over a WebSocket"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143.1",
  "uvicorn[standard]>=0.54.0",
  "psycopg[binary]>=3.3.6",
  "psycopg-pool>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
