# Every suite on PostgreSQL 16 and what depends on the version on 17 and 18, the way core/ci.sh runs them locally.
# Each job runs on GitHub's ubuntu-latest, a machine of its own. The full run on 16, the proofs, 17's and 18's other
# suites and the benchmark run nightly (nightly.yml).
name: ci
on:
  push:
    branches: [main]      # a pull request's branch runs once, as the pull request
  pull_request:
  workflow_dispatch:
# a new push to a pull request cancels its run still going (main's runs all finish)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# what a job needs beyond reading the repository, it says itself
permissions: {contents: read}
# Each job's timeout-minutes: about three times its longest run, ten at least, so that a step that hangs fails its
# job soon, not after GitHub's six hours (the suites' own: suites.yml)
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}     # the Zed extension's grammar commit is checked against this one
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.13"
      - run: python3 core/tests/unit_test.py
      # the Python is strongly typed, linted and laid out one way (ty.toml, ruff.toml)
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e   # v10.3.2
        with: {version: "0.12.21"}
      - run: uvx ty@0.0.56 check && uvx ruff@0.15.12 check && uvx ruff@0.15.12 format --check
      # the Python SDK, in its conformance app's environment (the SDK with every extra), that app, and the examples
      - run: uv sync --project integrations/fastapi --frozen && uvx ty@0.0.56 check --project sdk/python && uvx ty@0.0.56 check --project integrations/fastapi
      # the SDK's Django module, in the Django conformance app's environment (the SDK's has no Django), and that app
      - run: uv sync --project integrations/django --frozen && uvx ty@0.0.56 check --project integrations/django integrations/django sdk/python/rowstile/django
      - run: |
          for app in filemanager messenger; do
            uv sync --project examples/$app/backend --frozen && uvx ty@0.0.56 check --project examples/$app || exit 1
          done
  # The suites, in the parts run_tests.sh names, a version at a time (suites.yml): each part on a runner and in a
  # container of its own, side by side, so the wait is the longest part's and not their sum. They don't wait for the
  # unit job: their own unit part runs the same checks, measured (--short has no unit part: 17 and 18 run it nightly)
  # 16: every suite (run_tests.sh --quick); 17 and 18: what depends on the version (--short)
  suites-16:
    name: suites (16)
    uses: ./.github/workflows/suites.yml
    with: {pg: "16", mode: "", parts: '["unit", "policy", "command", "random"]'}
  suites-17:
    name: suites (17)
    uses: ./.github/workflows/suites.yml
    with: {pg: "17", mode: "--short", parts: '["policy", "command", "random"]'}
  suites-18:
    name: suites (18)
    uses: ./.github/workflows/suites.yml
    with: {pg: "18", mode: "--short", parts: '["policy", "command", "random"]'}
  # The checks `main` requires, under the names it knows: one per version, waiting for that version's parts alone,
  # green when every one of them was. Each runs whatever became of them (a job that is skipped counts as passed),
  # and fails unless they passed
  postgres-16:
    name: postgres (16)
    needs: suites-16
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          echo "the suites on 16, every part: $SUITES"
          test "$SUITES" = success
        env: {SUITES: "${{ needs.suites-16.result }}"}
  postgres-17:
    name: postgres (17, --short)
    needs: suites-17
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          echo "the suites on 17, every part: $SUITES"
          test "$SUITES" = success
        env: {SUITES: "${{ needs.suites-17.result }}"}
  postgres-18:
    name: postgres (18, --short)
    needs: suites-18
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          echo "the suites on 18, every part: $SUITES"
          test "$SUITES" = success
        env: {SUITES: "${{ needs.suites-18.result }}"}
  # What the suites run of authzlib and cli, every part's measure together (core/tests/coverage_report.py:
  # the table here, what nothing runs line by line in the artifact). On a pull request, a line it adds or changes
  # there that nothing runs fails the job; and on any run, rowstile's PL/pgSQL never run other than
  # core/tests/plpgsql_floor.txt says (more: a suite must run it; fewer: the file is written anew)
  coverage:
    needs: suites-16   # (16's parts measure: suites.yml)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}     # the changes are read against main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with: {pattern: "coverage-pg*", path: .ci/parts}
      - run: docker build -q -t rowstile:16-coverage --build-arg PG_MAJOR=16 --build-arg COVERAGE=1 -f core/Dockerfile .
      - run: >-
          docker run --rm -v "$PWD:/src" -w /src/core --entrypoint bash rowstile:16-coverage
          -c "python3 tests/coverage_report.py --out /src/.ci/coverage $DIFF --floor tests/plpgsql_floor.txt /src/.ci/parts/coverage-pg*/.coverage"
        env: {DIFF: "${{ github.event_name == 'pull_request' && '--diff origin/main' || '' }}"}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: coverage
          path: .ci/coverage/report.txt
          if-no-files-found: ignore
  # rowstile review on every pull request: one comment, updated in place, on what it does to the file manager's
  # policy ("unchanged" when it doesn't touch it), and a warning on each line it flags (review-ci/github/action.yml),
  # with this commit's command. It runs on all of them, so the action and the review are tried on each
  review:
    if: github.event_name == 'pull_request'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read, pull-requests: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: ./review-ci/github
        with: {version: source, working-directory: examples/filemanager}
  # The Python SDK's conformance suite: FastAPI, SQLAlchemy async and asyncpg, Alembic, and background jobs in
  # Celery's and RQ's workers on Redis (integrations/fastapi). It fails unless its checks run every line and branch
  # of the SDK; the report it prints is kept
  conformance-python:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e   # v10.3.2
        with: {version: "0.12.21"}
      - run: bash integrations/fastapi/test.sh
        env: {CONFORMANCE_COVERAGE: "${{ runner.temp }}/sdk-coverage-python"}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: sdk-coverage-python
          path: ${{ runner.temp }}/sdk-coverage-python/report.txt
          if-no-files-found: ignore
  # The Python SDK's Django module's conformance suite, a preview: Django on psycopg 3, Django's migrations,
  # pytest-django and two of pytest-xdist's workers (integrations/django). It fails unless its checks run every line
  # and branch of the module; the report it prints is kept
  conformance-django:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e   # v10.3.2
        with: {version: "0.12.21"}
      - run: bash integrations/django/test.sh
        env: {CONFORMANCE_COVERAGE: "${{ runner.temp }}/sdk-coverage-django"}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: sdk-coverage-django
          path: ${{ runner.temp }}/sdk-coverage-django/report.txt
          if-no-files-found: ignore
  # The TypeScript SDK's conformance suite: Next.js, Prisma 7 (Prisma Migrate), pg, postgres.js, Drizzle, the
  # React kit, Vitest (integrations/nextjs). It fails unless its checks run every line, branch and function of the
  # SDK; the report it prints is kept, with each file's details (coverage-final.json)
  conformance-typescript:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: bash integrations/nextjs/test.sh
        env: {CONFORMANCE_COVERAGE: "${{ runner.temp }}/sdk-coverage-typescript"}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: sdk-coverage-typescript
          path: |
            ${{ runner.temp }}/sdk-coverage-typescript/report.txt
            ${{ runner.temp }}/sdk-coverage-typescript/coverage-final.json
          if-no-files-found: ignore
      # @rowstile/vitest's matchers type-check with each Vitest it supports (4, 5)
      - run: npx tsc -b sdk/typescript && bash sdk/typescript/vitest/types-test/types.sh
  # The Go SDK's conformance suite, a preview: net/http, pgx, sqlc, goose (integrations/go). It fails unless its
  # checks run every statement of the SDK (Go's coverage counts no branches); the report it prints is kept, with the
  # profile
  conformance-go:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e   # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: integrations/go/go.sum
      - run: bash integrations/go/test.sh
        env: {CONFORMANCE_COVERAGE: "${{ runner.temp }}/sdk-coverage-go"}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: sdk-coverage-go
          path: |
            ${{ runner.temp }}/sdk-coverage-go/report.txt
            ${{ runner.temp }}/sdk-coverage-go/cover.out
          if-no-files-found: ignore
  # The plain Node server's conformance suite, a preview: Express 5 on pg, Drizzle (Drizzle Kit's migrations) and
  # postgres.js, its tests on Jest (integrations/node). It fails unless its checks run every line, branch and
  # function of @rowstile/jest; the report it prints of the packages it uses is kept, with each file's details
  conformance-node:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: bash integrations/node/test.sh
        env: {CONFORMANCE_COVERAGE: "${{ runner.temp }}/sdk-coverage-node"}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: sdk-coverage-node
          path: |
            ${{ runner.temp }}/sdk-coverage-node/report.txt
            ${{ runner.temp }}/sdk-coverage-node/coverage-final.json
          if-no-files-found: ignore
  # Electric's conformance suite, a preview: Postgres with logical replication, Electric in manual publication mode
  # on a role of its own, an Express app whose shape routes are @rowstile/client's electricShape, nginx as a cache in
  # front of it, the checks on Vitest with Electric's own client (integrations/electric). It fails unless its checks
  # run every line, branch and function of electricShape; the report it prints is kept, with the file's details. It runs
  # whole in each of the sync index's modes, a job each, so each mode's result shows apart (conformance-electric
  # (copied), (keyed), (after)): copied in, keyed by folder, and after commit with a worker beside the app
  conformance-electric:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [copied, keyed, after]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: bash integrations/electric/test.sh
        env:
          SYNC_MODE: ${{ matrix.mode }}
          CONFORMANCE_COVERAGE: "${{ runner.temp }}/sdk-coverage-electric"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: sdk-coverage-electric-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/sdk-coverage-electric/report.txt
            ${{ runner.temp }}/sdk-coverage-electric/coverage-final.json
          if-no-files-found: ignore
  # Zero's conformance suite, a preview: Postgres with logical replication, zero-cache on a role of its own (no
  # superuser: no event triggers), the app's publication, an Express app with Zero's query and mutate endpoints, the
  # checks on Vitest with Zero's own client in Node (integrations/zero). It runs whole in each of the sync index's
  # modes, a job each (conformance-zero (copied), (keyed), (after))
  conformance-zero:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [copied, keyed, after]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: bash integrations/zero/test.sh
        env:
          SYNC_MODE: ${{ matrix.mode }}
  # The .NET SDK's conformance suite (a preview): ASP.NET Core, EF Core on Npgsql, EF Core's migrations, xUnit
  # (integrations/aspnetcore). It fails unless its checks run every line and branch of the SDK (coverlet); the report it
  # prints is kept
  conformance-aspnetcore:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with: {dotnet-version: "10.0.x"}
      - run: bash integrations/aspnetcore/test.sh
        env: {CONFORMANCE_COVERAGE: "${{ runner.temp }}/sdk-coverage-dotnet"}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: sdk-coverage-dotnet
          path: ${{ runner.temp }}/sdk-coverage-dotnet/report.txt
          if-no-files-found: ignore
  # The Ruby SDK's conformance suite: Rails 8, Active Record on pg, Puma, Active Job, Minitest (integrations/rails).
  # Ruby runs in a container, on the image integrations/images/Dockerfile pins. It fails unless its checks run every
  # line and branch of the gem (SimpleCov); the report it prints is kept
  conformance-rails:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - run: bash integrations/rails/test.sh
        env: {CONFORMANCE_COVERAGE: "${{ runner.temp }}/sdk-coverage-ruby"}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: sdk-coverage-ruby
          path: ${{ runner.temp }}/sdk-coverage-ruby/report.txt
          if-no-files-found: ignore
  # The Java SDK's conformance suite (preview): Spring Boot, Spring Security, JPA and JdbcClient over HikariCP,
  # Flyway (integrations/spring). It fails unless its checks run every line and branch of the SDK (JaCoCo); the
  # report it prints is kept, with each module's pages
  conformance-spring:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad   # v6.1.0
        with: {distribution: temurin, java-version: "21", cache: maven}
      - run: bash integrations/spring/test.sh
        env: {CONFORMANCE_COVERAGE: "${{ runner.temp }}/sdk-coverage-java"}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: sdk-coverage-java
          path: ${{ runner.temp }}/sdk-coverage-java/
          if-no-files-found: ignore
  # The Kotlin SDK's conformance suite (preview): Ktor, Exposed over HikariCP, Flyway (integrations/ktor). It fails
  # unless its checks run every line and branch of the Kotlin module (JaCoCo); the report it prints is kept, with its
  # pages
  conformance-ktor:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad   # v6.1.0
        with: {distribution: temurin, java-version: "21", cache: maven}
      - run: bash integrations/ktor/test.sh
        env: {CONFORMANCE_COVERAGE: "${{ runner.temp }}/sdk-coverage-kotlin"}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: sdk-coverage-kotlin
          path: ${{ runner.temp }}/sdk-coverage-kotlin/
  # The Rust SDK's conformance suite (preview): Axum on sqlx, sqlx's migrations, and the SDK's tokio-postgres module
  # (integrations/axum). Rust runs in a container, on the image integrations/images/Dockerfile pins. It fails unless
  # its checks run every line and region of the SDK (cargo-llvm-cov); the report it prints is kept
  conformance-axum:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - run: bash integrations/axum/test.sh
        env: {CONFORMANCE_COVERAGE: "${{ runner.temp }}/sdk-coverage-rust"}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: sdk-coverage-rust
          path: ${{ runner.temp }}/sdk-coverage-rust/report.txt
          if-no-files-found: ignore
  # The Elixir SDK's conformance suite (preview): Phoenix on Bandit, Ecto on Postgrex, Oban, ExUnit
  # (integrations/phoenix). Elixir runs in a container, on the image integrations/images/Dockerfile pins; Hex's
  # packages, the builds and Dialyzer's tables are kept in the cache, by the lock files. It fails unless its checks
  # run every line of the SDK (Erlang's cover); the report it prints is kept
  conformance-phoenix:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: ~/.cache/rowstile/phoenix
          key: phoenix-${{ hashFiles('sdk/elixir/mix.lock', 'integrations/phoenix/mix.lock', 'integrations/images/Dockerfile') }}
      - run: bash integrations/phoenix/test.sh
        env: {CONFORMANCE_COVERAGE: "${{ runner.temp }}/sdk-coverage-elixir"}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: sdk-coverage-elixir
          path: ${{ runner.temp }}/sdk-coverage-elixir/report.txt
          if-no-files-found: ignore
  # The PHP SDK's conformance suite (preview): Laravel, Eloquent on pdo_pgsql, the queue's worker, PHPUnit with paratest
  # (integrations/laravel). PHP and Composer run in a container, on the images integrations/images/Dockerfile pins. It
  # fails unless its checks run every line and branch of the SDK (Xdebug); the report it prints is kept
  conformance-laravel:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - run: bash integrations/laravel/test.sh
        env: {CONFORMANCE_COVERAGE: "${{ runner.temp }}/sdk-coverage-php"}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: sdk-coverage-php
          path: ${{ runner.temp }}/sdk-coverage-php/report.txt
          if-no-files-found: ignore
  # The playground: the compiler in Pyodide and its SQL in PGlite, headless (every example's tests pass), then the
  # page in Chrome (loaded from the CDN, a mistake and its page, asking as someone, links; loading, cached, under
  # 10 s: the design's limit is 5 s, and GitHub's runners took up to 5.9 s)
  playground:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: "24"
      - run: cd playground && npm ci --no-audit --no-fund && node test.mjs
      - run: cd playground && node build.mjs && node browser_test.mjs
        env: {PLAYGROUND_LIMIT_MS: "10000"}
  # Studio's page in Chrome (core/tests/studio_page.sh), on the docs app in a Postgres of its own: each row's cells
  # under their headings, "Why?" as anyone and as someone, the graph (Mermaid from the CDN, its hash checked), the
  # shares and requests as the API sends them, and a policy applied while the page is open
  studio-page:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: "24"
      - run: docker build -q -t rowstile:16 --build-arg PG_MAJOR=16 -f core/Dockerfile .
      - run: bash core/tests/studio_page.sh
  # The docs site: the repository's Markdown built with VitePress (a link to a page, a file or a heading that isn't
  # there fails the build, and so does a page no menu lists), with the playground, llms.txt and llms-full.txt beside
  # it (site/build.mjs)
  site:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: "24"
      # the blog's checks first (a post's file, the feed), on made-up posts: the build has them only once there is a post;
      # then what a tag is built from (a release's, the site's), on made-up tags and in a repository made for it; then
      # the links (pages.mjs) on made-up pages and menus
      - run: cd site && npm ci --no-audit --no-fund && node blog_test.mjs && node source_test.mjs && node pages_test.mjs && node build.mjs
  # The JavaScript is typed (JSDoc) and checked strictly by TypeScript, each part with its own dependencies' types
  javascript:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: "24"
      # the root: TypeScript and @types/node; the folders: what their scripts use (types only: no install scripts)
      - run: |
          npm ci --no-audit --no-fund --ignore-scripts
          for d in playground site editor editor/tree-sitter-authz; do
            (cd "$d" && npm ci --no-audit --no-fund --ignore-scripts) || exit 1
          done
      - run: |
          for p in core/cli/tsconfig.studio.json core/tests packaging/npm playground site editor editor/tree-sitter-authz; do
            npx tsc -p "$p" || exit 1
          done
      # the client `rowstile client ts` writes, under tsc --strict: correct calls pass, wrong names don't
      - run: python3 core/tests/client_types.py
  # The editors: the Tree-sitter grammar (generated, its corpus, every policy in the repository parses, read as the
  # parser reads it), the VS Code extension packaged as its README says, Neovim set up as it says, and the Zed
  # extension's build (editor/test.sh)
  editor:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - run: bash editor/test.sh
  # The ways rowstile is installed, each on a clean machine: npm (no Python there; Linux arm64 emulated, the macOS
  # and Windows packages read), PyPI, the command's image (on each platform release.yml publishes it for, arm64
  # under emulation)
  packaging:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ROWSTILE_IMAGE_PLATFORMS: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      # arm64 under emulation, for the npm packages and the image; the binfmt image by digest (Dependabot doesn't move it)
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1   # v4.4.0
        with: {platforms: arm64, cache-image: false, image: "docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0"}
      - run: bash packaging/test.sh
  # The file manager against the rowstile image built from the same commit: its public-surface
  # check, the generated client matching its policy, the API tests with RustFS, and the web app's build and tests.
  filemanager:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e   # v10.3.2
        with: {version: "0.12.21"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: "24"
      - run: cd examples/filemanager/frontend && npm ci && npm run build && npm test
      - run: bash examples/filemanager/test.sh

  messenger:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e   # v10.3.2
        with: {version: "0.12.21"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: "24"
      - run: cd examples/messenger/frontend && npm ci && npm run build && npm test
      - run: bash examples/messenger/test.sh
