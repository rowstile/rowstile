# Every suite on PostgreSQL 16 and what depends on the version on 17 and 18, the way core/ci.sh runs them locally.
# Each job runs on GitHub's ubuntu-latest, or on the runner labelled by the repository variable RUNNER when it
# is set (the laptop's self-hosted runners were, until 2026-10-03). Never set it on a public repository: its
# pull requests would run on that machine.
# Self-hosted runners would share one machine: a job that starts fixed-name containers or ports (the examples,
# the conformance suites, the packaging tests) holds a lock of its own (flock), so the same job from two runs
# waits rather than colliding; on GitHub's runners each job has a machine of its own and the lock is free. The proofs, 17's and 18's other suites and the benchmark run nightly (nightly.yml).
name: ci
on:
  push:
    branches: [main]      # a pull request's branch runs once, as the pull request
  pull_request:
  workflow_dispatch:
# a new push to a pull request cancels its run still going (main's runs all finish)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# what a job needs beyond reading the repository, it says itself
permissions: {contents: read}
jobs:
  unit:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {fetch-depth: 0}     # the Zed extension's grammar commit is checked against this one
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: "3.13"
      - run: python3 core/tests/unit_test.py
      # the Python is strongly typed, linted and laid out one way (ty.toml, ruff.toml)
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884   # v10.3.0
        with: {version: "0.12.21"}
      - run: uvx ty@0.0.56 check && uvx ruff@0.15.12 check && uvx ruff@0.15.12 format --check
      # the Python SDK, in its conformance app's environment (the SDK with every extra), that app, and the examples
      - run: uv sync --project integrations/fastapi --frozen && uvx ty@0.0.56 check --project sdk/python && uvx ty@0.0.56 check --project integrations/fastapi
      - run: |
          for app in filemanager messenger; do
            uv sync --project examples/$app/backend --frozen && uvx ty@0.0.56 check --project examples/$app || exit 1
          done
  # The suites, in the parts run_tests.sh names: each on a runner and in a container of its own, side by
  # side, so the wait is the longest part's and not their sum. They don't wait for the unit job: their own unit
  # part runs the same checks, measured (--short has no unit part: 17 and 18 run it nightly)
  suites:
    name: suites (${{ matrix.pg }}, ${{ matrix.part }})
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    env:
      # the label on this job's containers: its run, attempt, job, version and part
      ROWSTILE_CI_JOB: "${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.pg }}-${{ matrix.part }}"
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17", "18"]
        part: [unit, policy, command, random]
        include:
          - {pg: "16", mode: ""}           # every suite (run_tests.sh --quick)
          - {pg: "17", mode: "--short"}    # what depends on the version; the rest runs nightly
          - {pg: "18", mode: "--short"}
        exclude:
          - {pg: "17", part: unit}
          - {pg: "18", part: unit}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      # --coverage, on 16: each Python process also measures what it runs of authzlib and cli (the coverage job reads
      # it). 17 and 18 run less and added nothing (2026-10-10: the same lines, branches and functions as 16 alone)
      - run: bash core/ci.sh ${{ matrix.pg == '16' && '--coverage' || '' }} ${{ matrix.mode }} ${{ matrix.pg }}
        env: {ROWSTILE_CI_LOGS: "${{ runner.temp }}", ROWSTILE_PART: "${{ matrix.part }}"}
      # a cancelled job may stop before ci.sh removes its container: this job's own (the label names the job)
      - if: always()
        run: docker ps -aq --filter "label=rowstile.ci=$ROWSTILE_CI_JOB" | xargs -r docker rm -f -v
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: logs-pg${{ matrix.pg }}-${{ matrix.part }}
          path: ${{ runner.temp }}/rowstile-ci-${{ matrix.pg }}.log
      # what it measured: the lines, combined in one file (ci.sh's report made it, its name starts with a dot), and
      # the calls of rowstile's functions
      - if: success() && matrix.pg == '16'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: coverage-pg${{ matrix.pg }}-${{ matrix.part }}
          path: |
            .ci/coverage-${{ matrix.pg }}/.coverage
            .ci/coverage-${{ matrix.pg }}/functions.tsv
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  # The checks `main` requires, under the names it knows: one per version, green when every part above was.
  # It runs whatever became of them (a job that is skipped counts as passed), and fails unless they passed
  postgres:
    needs: suites
    if: always()
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {pg: "16", mode: ""}
          - {pg: "17", mode: "--short"}
          - {pg: "18", mode: "--short"}
    steps:
      - run: |
          echo "the suites, all versions and parts together: $SUITES"
          test "$SUITES" = success
        env: {SUITES: "${{ needs.suites.result }}"}
  # What the suites run of authzlib and cli, every part's measure together (core/tests/coverage_report.py:
  # the table here, what nothing runs line by line in the artifact). On a pull request, a line it adds or changes
  # there that nothing runs fails the job
  coverage:
    needs: suites
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {fetch-depth: 0}     # the changes are read against main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with: {pattern: "coverage-pg*", path: .ci/parts}
      - run: docker build -q -t rowstile:16-coverage --build-arg PG_MAJOR=16 --build-arg COVERAGE=1 -f core/Dockerfile .
      - run: >-
          docker run --rm -v "$PWD:/src" -w /src/core --entrypoint bash rowstile:16-coverage
          -c "python3 tests/coverage_report.py --out /src/.ci/coverage $DIFF /src/.ci/parts/coverage-pg*/.coverage"
        env: {DIFF: "${{ github.event_name == 'pull_request' && '--diff origin/main' || '' }}"}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: coverage
          path: .ci/coverage/report.txt
          if-no-files-found: ignore
  # rowstile review on pull requests: one comment, updated in place, on what the file manager's
  # policy change does, and a warning on each line it flags (review-ci/github/action.yml), with this commit's command
  review:
    if: github.event_name == 'pull_request'
    needs: unit
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions: {contents: read, pull-requests: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {fetch-depth: 0}
      - uses: ./review-ci/github
        with: {version: source, working-directory: examples/filemanager}
  # The Python SDK's conformance suite: FastAPI, SQLAlchemy async and asyncpg, Alembic (integrations/fastapi). It
  # fails unless its checks run every line and branch of the SDK; the report it prints is kept
  conformance-python:
    needs: unit
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884   # v10.3.0
        with: {version: "0.12.21"}
      - run: flock /tmp/rowstile-ci-conformance-python.lock bash integrations/fastapi/test.sh
        env: {CONFORMANCE_COVERAGE: "${{ runner.temp }}/sdk-coverage-python"}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: sdk-coverage-python
          path: ${{ runner.temp }}/sdk-coverage-python/report.txt
          if-no-files-found: ignore
  # The TypeScript SDK's conformance suite: Next.js, Prisma 7 (Prisma Migrate), pg, postgres.js, Drizzle, the
  # React kit, Vitest (integrations/nextjs). It fails unless its checks run every line, branch and function of the
  # SDK; the report it prints is kept, with each file's details (coverage-final.json)
  conformance-typescript:
    needs: unit
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: flock /tmp/rowstile-ci-conformance-typescript.lock bash integrations/nextjs/test.sh
        env: {CONFORMANCE_COVERAGE: "${{ runner.temp }}/sdk-coverage-typescript"}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: sdk-coverage-typescript
          path: |
            ${{ runner.temp }}/sdk-coverage-typescript/report.txt
            ${{ runner.temp }}/sdk-coverage-typescript/coverage-final.json
          if-no-files-found: ignore
      # @rowstile/vitest's matchers type-check with each Vitest it supports (4, 5)
      - run: npx tsc -b sdk/typescript && bash sdk/typescript/vitest/types-test/types.sh
  # The playground: the compiler in Pyodide and its SQL in PGlite, headless (every example's tests pass), then the
  # page in Chrome (loaded from the CDN, a mistake and its page, asking as someone, links; loading, cached, under
  # 10 s: the design's 5 s is measured on the dev laptop, where it takes 3.5 s; GitHub's runners took up to 5.9 s)
  playground:
    needs: unit
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: "24"
      - run: cd playground && npm ci --no-audit --no-fund && node test.mjs
      - run: cd playground && node build.mjs && node browser_test.mjs
        env: {PLAYGROUND_LIMIT_MS: "10000"}
  # The docs site: the repository's Markdown built with VitePress (a link to a page or a file that isn't there fails
  # the build), with the playground, llms.txt and llms-full.txt beside it (site/build.mjs)
  site:
    needs: unit
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: "24"
      # the blog's checks first (a post's file, the feed), on made-up posts: the build has them only once there is a post;
      # then what a tag is built from (a release's, the site's), on made-up tags and in a repository made for it
      - run: cd site && npm ci --no-audit --no-fund && node blog_test.mjs && node source_test.mjs && node build.mjs
  # The JavaScript is typed (JSDoc) and checked strictly by TypeScript, each part with its own dependencies' types
  javascript:
    needs: unit
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: "24"
      # the root: TypeScript and @types/node; the folders: what their scripts use (types only: no install scripts)
      - run: |
          npm ci --no-audit --no-fund --ignore-scripts
          for d in playground site editor editor/tree-sitter-authz; do
            (cd "$d" && npm ci --no-audit --no-fund --ignore-scripts) || exit 1
          done
      - run: |
          for p in core/cli/tsconfig.studio.json packaging/npm playground site editor editor/tree-sitter-authz; do
            npx tsc -p "$p" || exit 1
          done
      # the client `rowstile client ts` writes, under tsc --strict: correct calls pass, wrong names don't
      - run: python3 core/tests/client_types.py
  # The editors: the Tree-sitter grammar (generated, its corpus, every policy in the repository parses, read as the
  # parser reads it) and the Zed extension's build (editor/test.sh)
  editor:
    needs: unit
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - run: bash editor/test.sh
  # The ways rowstile is installed, each on a clean machine: npm (no Python there), PyPI, the command's image
  packaging:
    needs: unit
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - run: flock /tmp/rowstile-ci-packaging.lock bash packaging/test.sh
  # The file manager against the rowstile image built from the same commit: its public-surface
  # check, the generated client matching its policy, the API tests with RustFS, and the web app's build.
  filemanager:
    needs: unit
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884   # v10.3.0
        with: {version: "0.12.21"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: "24"
      - run: cd examples/filemanager/frontend && npm ci && npm run build
      - run: flock /tmp/rowstile-ci-filemanager.lock bash examples/filemanager/test.sh

  messenger:
    needs: unit
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884   # v10.3.0
        with: {version: "0.12.21"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: "24"
      - run: cd examples/messenger/frontend && npm ci && npm run build
      - run: flock /tmp/rowstile-ci-messenger.lock bash examples/messenger/test.sh
