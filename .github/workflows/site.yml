# The docs site on GitHub Pages (rowstile.dev), built from a release tag so it shows what was released. A release's
# tag deploys it when that release becomes what a plain install gets (npm's `latest`), or while no final release
# exists yet; an alpha, a beta or a candidate after one doesn't.
# A site tag (site-v1, site-v2, ...) publishes the blog and the comparison pages between releases: the site is built
# from the release it shows, with docs/blog/ and docs/compare/ as they are at the site tag (site/source.mjs).
# Run by hand, it deploys the tag it is given:
#   gh workflow run site.yml -f tag=v0.1.0
name: site
on:
  push:
    tags: ["v*", "site-v*"]
  workflow_dispatch:
    inputs:
      tag: {description: "the tag to deploy: a release's (v0.1.0) or the site's (site-v3)", required: true}
permissions: {contents: read}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    outputs:
      deploy: ${{ steps.which.outputs.deploy }}
    env:
      GIVEN: ${{ inputs.tag || github.ref_name }}
    steps:
      # this workflow's own commit, with every tag: its site/source.mjs says what the tag is built from, and checks
      # that out. It is kept aside, since the release's files replace it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with: {node-version: "24"}
      - id: from
        run: |
          cp site/source.mjs "$RUNNER_TEMP/source.mjs"
          node "$RUNNER_TEMP/source.mjs" --take "$GIVEN" >> "$GITHUB_OUTPUT"
      - id: which
        env:
          CODE: ${{ steps.from.outputs.code }}
          CONTENT: ${{ steps.from.outputs.content }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          [ -n "$CODE" ] || { echo "::error::site/source.mjs didn't say which release to build from"; exit 1; }
          echo "::notice::built from $CODE${CONTENT:+, with the blog and the comparison pages of $CONTENT}"
          tag=$(python3 packaging/version.py --dist-tag)
          finals=$(git tag -l 'v*' | grep -cE '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          # a site tag is built from the release the site shows: it always deploys
          if [ "$MANUAL" = true ] || [ "$GIVEN" != "$CODE" ] || [ "$tag" = latest ] || { [ "$tag" = next ] && [ "$finals" = 0 ]; }; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::npm's $tag: the site stays at the release a plain install gets"
          fi
      # its links to the repository's files go to the tags it is built from, not main (site/pages.mjs)
      - env:
          SITE_CODE: ${{ steps.from.outputs.code }}
          SITE_CONTENT: ${{ steps.from.outputs.content }}
        run: cd site && npm ci --no-audit --no-fund && node build.mjs
      # a release from before the blog builds without a word and without the posts: say so, and deploy nothing
      - run: node "$RUNNER_TEMP/source.mjs" --built
      - if: steps.which.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with: {path: site/dist/}

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions: {pages: write, id-token: write}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
