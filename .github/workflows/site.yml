# The docs site on GitHub Pages (rowstile.dev): the whole site (its code, the home page, the docs, the playground)
# built from a tag's own commit, without waiting for a release. A site tag (site-v1, site-v2, ...) on a commit of
# main deploys it, and so does a release's tag on main; one pushed on a commit older than another's deploys nothing,
# so the site never goes back by itself (site/source.mjs holds the rule). Run by hand, it deploys the tag it is
# given, whatever comes after it:
#   gh workflow run site.yml -f tag=site-v3
name: site
on:
  push:
    tags: ["v*", "site-v*"]
  workflow_dispatch:
    inputs:
      tag: {description: "the tag to deploy: a site tag (site-v3) or a release's (v0.1.0), on main", required: true}
permissions: {contents: read}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy: ${{ steps.from.outputs.deploy }}
    env:
      GIVEN: ${{ inputs.tag || github.ref_name }}
    steps:
      # this workflow's own commit, with every tag: its site/source.mjs says whether the tag deploys, and checks it
      # out. It is kept aside, since the tag's files replace it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with: {node-version: "24"}
      - id: from
        env:
          BY_HAND: ${{ github.event_name == 'workflow_dispatch' && '--by-hand' || '' }}
        run: |
          cp site/source.mjs "$RUNNER_TEMP/source.mjs"
          node "$RUNNER_TEMP/source.mjs" --take "$GIVEN" $BY_HAND >> "$GITHUB_OUTPUT"
      - if: steps.from.outputs.deploy != 'true'
        env:
          WHY: ${{ steps.from.outputs.why }}
        run: echo "::notice::$GIVEN deploys nothing ($WHY)"
      # its links to the repository's files go to the tag it is built from, not main (site/pages.mjs)
      - if: steps.from.outputs.deploy == 'true'
        env:
          SITE_CODE: ${{ env.GIVEN }}
        run: cd site && npm ci --no-audit --no-fund && node build.mjs
      - if: steps.from.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with: {path: site/dist/}

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {pages: write, id-token: write}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1

  # tells Bing and the other engines that take IndexNow to read every page again (site/indexnow.mjs): a refusal is
  # said in the job's log, and never fails the deploy
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with: {node-version: "24"}
      - run: node site/indexnow.mjs
        continue-on-error: true
