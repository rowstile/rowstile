# Publishes a version (RELEASING.md): set it with `python3 packaging/version.py X.Y.Z` (or X.Y.Z-alpha.N,
# X.Y.Z-beta.N, X.Y.Z-rc.N), commit,
# push the tag vX.Y.Z on a commit of main or of release/X.Y, once CI is green on it (its version aside: below). A -dev
# version (main between releases) is refused.
# It publishes to PyPI and npm (trusted publishing: no token; PyPI with its attestations, npm with provenance), the
# image on ghcr.io (with its provenance), and a GitHub release that holds the wheel, the sdist, the launcher and the
# editor extension (.vsix) with their provenance (.intoto.jsonl); the docs site is site.yml's (GitHub Pages). Each
# file is built once, in a job that can write and sign nothing (release-files, npm-files), and published as built:
# PyPI and the Marketplace get the files the GitHub release attaches. An alpha, a beta or a release candidate is
# npm's `next` and a pre-release on GitHub, and never the image's `latest`. While no final release exists it
# becomes npm's `latest` too, so a plain install gets the newest (packaging/npm_latest.py); once one exists, only a
# release is `latest`. A patch to an older line (release-X.Y) moves no `latest`: npm's, the image's or GitHub's.
# A release that stopped half-way is finished by running its jobs again: what is published already is skipped.
# Run by hand (workflow_dispatch), it builds and checks everything and publishes nothing. With latest=true it does
# one thing instead, from main: npm's `latest` goes where `next` is, for a release whose own run couldn't move it
#   gh workflow run release.yml -f latest=true
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      latest: {description: "only move npm's latest to where next is (publishes nothing)", type: boolean, default: false}

# what a job needs beyond reading the repository, it says itself
permissions: {contents: read}
# the image's platforms: an Apple Silicon Mac's Docker and arm64 machines (Graviton, GitHub's arm64 runners) run
# the arm64 one. The check job's packaging tests run each (arm64 under QEMU) before the image job builds them
env:
  ROWSTILE_IMAGE_PLATFORMS: linux/amd64,linux/arm64

jobs:
  check:
    if: ${{ !inputs.latest }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions: read, for ci.yml's runs (below)
    permissions: {contents: read, actions: read}
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      npm-tag: ${{ steps.v.outputs.npm-tag }}
    steps:
      # every branch and tag: the unit tests check the Zed extension's grammar commit is in the history, and the
      # tag's commit is looked for on main and release/X.Y
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - id: v
        run: |
          version=$(python3 packaging/version.py)   # fails when two files disagree
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "the tag is $GITHUB_REF_NAME, the version $version"; exit 1; }
            case "$version" in *-dev) echo "$version is main between releases: it is never published"; exit 1;; esac
            # on a commit of main, or of release/X.Y for a patch to its line (RELEASING.md): never another branch's
            line=$(cut -d. -f1-2 <<< "$version")
            on=
            for branch in main "release/$line"; do
              if git merge-base --is-ancestor HEAD "refs/remotes/origin/$branch" 2>/dev/null; then on="$on $branch"; fi
            done
            [ -n "$on" ] || { echo "the tag $GITHUB_REF_NAME is on a commit of neither main nor release/$line (RELEASING.md)"; exit 1; }
            # its notes: CHANGELOG.md has its section, and nothing is left under Unreleased
            python3 packaging/changelog.py --tagged "$version" > /dev/null
            echo "branches=${on# }" >> "$GITHUB_OUTPUT"
            publish=public
          else
            publish=none
          fi
          # next for an alpha, a beta or a candidate, latest for the highest release, release-X.Y for a patch to an older line
          tag=$(python3 packaging/version.py --dist-tag)
          echo "version $version: publish $publish, npm tag $tag"
          { echo "version=$version"; echo "publish=$publish"; echo "npm-tag=$tag"; } >> "$GITHUB_OUTPUT"
      # every suite passed on it: ci.yml's run of a push to its branch, green, on this commit or on a later one of
      # that branch that is this one but for its version. Rebased onto main, the release pull request's first commit has
      # no run of its own: its second, main's next version, has (RELEASING.md). Tagged before that run is green, it
      # stops here, and runs again once it is
      - id: ci
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCHES: ${{ steps.v.outputs.branches }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          tagged=$(git rev-parse HEAD)
          runs=$(for branch in $BRANCHES; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$branch&event=push&status=success&per_page=100" \
              --jq '.workflow_runs[] | "\(.id) \(.head_sha)"'
          done)
          tree=$(mktemp -d)/tree
          while read -r id sha; do
            [ -n "$sha" ] && git merge-base --is-ancestor "$tagged" "$sha" 2>/dev/null || continue
            git worktree add -q --detach "$tree" "$sha"
            if python3 "$tree/packaging/version.py" "$VERSION" > /dev/null 2>&1 && git -C "$tree" diff --quiet "$tagged"; then
              echo "every suite passed on $sha, this commit but for its version (ci.yml's run $id)"
              exit 0
            fi
            git worktree remove --force "$tree"
          done <<< "$runs"
          echo "::error::no green run of ci.yml on a push to $BRANCHES is on $tagged, or on a later commit that is it but for its version: run this workflow again once CI is green on the release's commits (RELEASING.md)"
          exit 1
      - run: python3 core/tests/unit_test.py
      # arm64 under emulation, for the npm packages' and the image's packaging tests; the binfmt image by digest (Dependabot doesn't move it)
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1   # v4.4.0
        with: {platforms: arm64, cache-image: false, image: "docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0"}
      - run: bash packaging/test.sh

  # the wheel and the sdist release-files built, the files the GitHub release attaches; PyPI keeps their
  # attestations (PEP 740), which the publish action makes by trusted publishing
  pypi:
    needs: [check, release-files]
    if: needs.check.outputs.publish == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with: {name: release-files, path: dist/}
      - run: mkdir pypi-dist && mv dist/*.whl dist/*.tar.gz pypi-dist/
      # a file PyPI has already is skipped: a release that stopped half-way is finished by running it again
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086   # release/v1
        with: {packages-dir: pypi-dist, skip-existing: true}

  # the npm packages, each packed as npm publishes it: built here, with no right to write or sign anything (npm ci
  # runs the install scripts of every package the workspace has); the npm job publishes these files
  npm-files:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with: {node-version: "24"}
      - run: node packaging/npm/build.mjs --all
      - run: npm ci --no-audit --no-fund && npx tsc -b sdk/typescript
      # each SDK package ships its own README (in its folder: its page on npm) and the licence
      - run: for d in sdk/typescript/*/; do cp LICENSE "$d"; done
      # the platforms first (rowstile names them as optional dependencies), then the launcher, then the SDK's: the
      # order the npm job publishes them in, a file and its package's name a line
      - run: |
          mkdir npm-dist
          for d in packaging/npm/out/cli-* packaging/npm/out/rowstile sdk/typescript/*/; do
            npm pack --json --pack-destination npm-dist "$d" \
              | node -e 'const [p] = JSON.parse(require("fs").readFileSync(0, "utf8")); console.log(p.filename, p.name)' >> npm-dist/order.txt
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with: {name: npm-files, path: npm-dist/}

  # npm-files' packages on npmjs.com. It runs no package's code: npm itself (checked by its hash) and these files
  npm:
    needs: [check, npm-files]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # npm trusts this workflow only in the environment `npm` (each package's trusted publisher names it), which
    # takes v* tags, and main for the `latest` job; a dry run, on a branch, publishes nothing and goes without it
    environment: ${{ needs.check.outputs.publish == 'public' && 'npm' || '' }}
    permissions: {id-token: write, contents: read}
    env:
      PUBLISH: ${{ needs.check.outputs.publish }}
      TAG: ${{ needs.check.outputs.npm-tag }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with: {node-version: "24", registry-url: "https://registry.npmjs.org", scope: "@rowstile"}
      # moving a tag by trusted publishing needs a newer npm than Node 24 brings (11.21.0 or newer), checked by its hash
      - run: bash packaging/npm/install_npm.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with: {name: npm-files, path: npm-dist/}
      # every package as the publish would send it, the launcher too: nothing is published unless each one passes
      - run: |
          while read -r file _ <&3; do
            npm publish --ignore-scripts --dry-run --tag "$TAG" --access public "./npm-dist/$file"
          done 3< npm-dist/order.txt
      # npmjs.com trusts this workflow (each package's trusted publisher: rowstile/rowstile, release.yml, npm): npm
      # trades the job's OIDC token for one publish, from npm 11.5.1 on.
      # A package npm doesn't have yet can't have a trusted publisher: its first publish takes a token, the
      # environment's secret NPM_TOKEN (npm falls back to it); delete the secret once the trusted publishers are set
      - if: env.PUBLISH == 'public'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || '' }}
        run: |
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"; then
            echo "::error::trusted publishing needs npm 11.5.1 or newer, this is $(npm --version)"; exit 1
          fi
          # a version the registry has already is skipped (it refuses it a second time): a release that stopped
          # half-way is finished by running this job again
          # a package npm doesn't have yet, without the token, is left out: the others go out, and the run names it
          # for its first publish by hand (its file is in this run's npm-files)
          new=""
          while read -r file name <&3; do
            if [ "$(npm view "$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "$name@$VERSION is published already"
            elif [ -z "$NODE_AUTH_TOKEN" ] && [[ "$(npm view "$name" name 2>&1)" == *E404* ]]; then
              echo "::warning::$name isn't on npm yet and there is no NPM_TOKEN: left out. Publish $file from this run's npm-files by hand (npm publish --access public --tag $TAG), then set its trusted publisher"
              new="$new $name"
            else
              npm publish --ignore-scripts --provenance --access public --tag "$TAG" "./npm-dist/$file"
            fi
          done 3< npm-dist/order.txt
          if [ -n "$new" ]; then
            echo "Not on npm yet, left out:$new. Publish each by hand from this run's npm-files." >> "$GITHUB_STEP_SUMMARY"
          fi
      # while no final release exists, a plain install gets the newest pre-release: npm's latest goes where next is, once
      # the registry shows this version there (minutes after the publish: read sooner, nothing looks left to
      # move). Each package's trusted publisher must allow it (Allow npm dist-tag); where one doesn't, or the
      # registry is too late, this says which and the release stands. The `latest` job does it again by hand
      - if: env.PUBLISH == 'public'
        continue-on-error: true
        env: {NODE_AUTH_TOKEN: ""}
        run: python3 packaging/npm_latest.py --move --published "$VERSION"

  # By hand, with latest=true, and alone: npm's latest goes where next is on every package, for a release whose
  # own run couldn't move it. It publishes nothing. From main, which the environment `npm` takes for this
  latest:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.latest }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions: {id-token: write, contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with: {node-version: "24", registry-url: "https://registry.npmjs.org"}
      - run: bash packaging/npm/install_npm.sh
      - env: {NODE_AUTH_TOKEN: ""}
        run: python3 packaging/npm_latest.py --move

  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # id-token and attestations: the image's provenance (below)
    permissions: {packages: write, contents: read, id-token: write, attestations: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - if: needs.check.outputs.publish == 'public'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6   # v4.7.0
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      # one image for each platform under one tag: arm64 is built under emulation, by a BuildKit that can build
      # several (the docker driver can't). Both images by digest: Dependabot doesn't move them
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1   # v4.4.0
        with: {platforms: arm64, cache-image: false, image: "docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0"}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1
        with: {driver-opts: "image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c"}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        id: build
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: ${{ env.ROWSTILE_IMAGE_PLATFORMS }}
          # the label org.opencontainers.image.version; the Dockerfile stops if it isn't the package's
          build-args: VERSION=${{ needs.check.outputs.version }}
          push: ${{ needs.check.outputs.publish == 'public' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/rowstile:${{ needs.check.outputs.version }}
            ${{ needs.check.outputs.npm-tag == 'latest' && format('ghcr.io/{0}/rowstile:latest', github.repository_owner) || '' }}
      # the image's provenance (SLSA, signed through Sigstore as this workflow), kept by GitHub and pushed beside it:
      # `gh attestation verify oci://ghcr.io/rowstile/rowstile:VERSION --repo rowstile/rowstile` checks it
      # (docs/installing.md). No storage record: that is the organisation's, and would take another right
      - if: needs.check.outputs.publish == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6   # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/rowstile
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  # the files a user can download: the wheel and sdist (PyPI's dry run: twine check), the extension (the launcher
  # is npm-files'). Built here, with no right to write or sign anything; github-release signs and publishes them,
  # pypi and vscode publish theirs
  release-files:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read}
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e   # v10.3.2
        with: {version: "0.12.21"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with: {node-version: "24"}
      # uv writes a .gitignore into the folder it builds into: not a file to download (0.1.0-alpha.1 had it). The
      # build's own packages (hatchling and what it needs) by their hashes (sdk/python/build-requirements.txt)
      - run: |
          uv build --build-constraint sdk/python/build-requirements.txt --require-hashes --out-dir dist sdk/python
          rm -f dist/.gitignore && uvx twine@7.0.0 check --strict dist/*
      # the extension starts the language server with vscode-languageclient: the .vsix carries it (package.json's
      # files lists node_modules; vsce keeps the production dependencies only). vsce is the one editor/publish's
      # lock file holds, as the vscode job's
      - run: npm ci --prefix editor/publish --ignore-scripts --no-audit --no-fund
      - run: cd editor && npm ci --omit=dev --no-audit --no-fund && publish/node_modules/.bin/vsce package --out ../dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with: {name: release-files, path: dist/}
      # the notes github-release takes, written in a dry run too (from main, a -dev version: what Unreleased holds)
      - run: python3 packaging/changelog.py "$VERSION" > /dev/null

  # the GitHub release: release-files' files and npm's launcher, their provenance, the notes. It runs none of the
  # packages' code
  github-release:
    needs: [check, release-files, npm-files]
    if: needs.check.outputs.publish == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # id-token and attestations: the files' provenance (below)
    permissions: {contents: write, id-token: write, attestations: write}
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with: {name: release-files, path: dist/}
      # the launcher npm has, named so as not to be taken for the sdist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with: {name: npm-files, path: npm-dist/}
      - run: mv "npm-dist/rowstile-$VERSION.tgz" "dist/rowstile-npm-$VERSION.tgz"
      # the files' provenance: where and how they were built (SLSA, signed through Sigstore as this workflow), kept
      # by GitHub and attached beside them as rowstile-<version>.intoto.jsonl. `gh attestation verify FILE --repo
      # rowstile/rowstile` checks a file against it (docs/installing.md)
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6   # v4.2.2
        with: {subject-path: "dist/*"}
      - env: {BUNDLE: "${{ steps.attest.outputs.bundle-path }}"}
        run: cp "$BUNDLE" "dist/rowstile-$VERSION.intoto.jsonl"
      # the notes are the release's section of CHANGELOG.md
      - run: python3 packaging/changelog.py "$VERSION" > release-notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64   # v3.0.3
        with:
          tag_name: v${{ env.VERSION }}
          name: rowstile ${{ env.VERSION }}
          files: dist/*
          body_path: release-notes.md
          prerelease: ${{ needs.check.outputs.npm-tag == 'next' }}
          # GitHub makes a release that isn't a pre-release its Latest unless told: not a patch to an older line
          make_latest: ${{ needs.check.outputs.npm-tag == 'latest' }}
          fail_on_unmatched_files: true

  # the Go module's version: Go reads a module in a folder from the tags sdk/go/vX.Y.Z, so the release's commit gets
  # one, once the GitHub release is made (`go get github.com/rowstile/rowstile/sdk/go` then takes the newest).
  # Go's module proxy keeps a version for ever: like v*, the tag is never moved (the tags' ruleset). Run again, it
  # leaves a tag that is there
  go-tag:
    needs: [check, github-release]
    if: needs.check.outputs.publish == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: write}
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          tag="sdk/go/v$VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "$tag is there"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" > /dev/null
            echo "pushed $tag on $GITHUB_SHA"
          fi
          # the proxy fetches a version the first time it is asked for: asked now, a user's first go get is quick
          curl -fsS --retry 5 "https://proxy.golang.org/github.com/rowstile/rowstile/sdk/go/@v/v$VERSION.info" ||
            echo "the module proxy doesn't have v$VERSION yet: it fetches it on the first go get"

  # the VS Code extension release-files packaged, the file the GitHub release attaches, on the Marketplace and Open
  # VSX when its own version (editor/package.json, raised when the extension changes) isn't there yet. Their tokens
  # are the environment vscode's, which takes v* tags only; a dry run, on a branch, finds the file and goes without
  # them
  vscode:
    needs: [check, release-files]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.check.outputs.publish == 'public' && 'vscode' || '' }}
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with: {node-version: "24"}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with: {name: release-files, path: dist/}
      # vsce and ovsx, each at the version editor/publish/package.json names and their dependencies at what its lock
      # file holds (checked by their hashes), with no install script run: the tokens are given to them alone
      - run: npm ci --prefix editor/publish --ignore-scripts --no-audit --no-fund
      # vsce names it after the extension and its version
      - id: vsix
        run: |
          version=$(node -p "require('./editor/package.json').version")
          ls "dist/rowstile-$version.vsix"
          { echo "version=$version"; echo "file=dist/rowstile-$version.vsix"; } >> "$GITHUB_OUTPUT"
      - if: needs.check.outputs.publish == 'public'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          EXTENSION: ${{ steps.vsix.outputs.version }}
          VSIX: ${{ steps.vsix.outputs.file }}
        run: |
          # a registry whose token isn't set is skipped, said in the run's summary
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::VSCE_PAT isn't set (environment vscode): not published on the VS Code Marketplace"
          # vsce show prints "undefined" for an extension the Marketplace doesn't have
          elif editor/publish/node_modules/.bin/vsce show rowstile.rowstile --json | node -e '
            let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              let versions = []; try { versions = JSON.parse(s).versions.map((v) => v.version) } catch {}
              process.exit(versions.includes(process.argv[1]) ? 0 : 1)
            })' "$EXTENSION"; then
            echo "the Marketplace has rowstile.rowstile $EXTENSION already"
          else
            editor/publish/node_modules/.bin/vsce publish --packagePath "$VSIX"
          fi
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT isn't set (environment vscode): not published on Open VSX"
          elif curl -sf "https://open-vsx.org/api/rowstile/rowstile/$EXTENSION" > /dev/null; then
            echo "Open VSX has rowstile.rowstile $EXTENSION already"
          else
            editor/publish/node_modules/.bin/ovsx publish "$VSIX"
          fi

  # The MCP server's entry in the official registry (registry.modelcontextprotocol.io): server.json, which names
  # the npm package. The registry reads `mcpName` in the package of that version, so this follows the npm job. It
  # believes this workflow's own token for names under io.github.rowstile/, so there is no secret. A dry run
  # checks the file and publishes nothing. The registry is a preview and may change or be away: this job never
  # fails a release (run it again once the registry answers). It marks as latest the highest version by semantic
  # versioning, not the one published last, so a patch to an older line doesn't become it.
  mcp:
    needs: [check, npm]
    runs-on: ubuntu-latest            # the publisher below is the one built for x64
    timeout-minutes: 20
    continue-on-error: true
    permissions: {id-token: write, contents: read}
    env:
      PUBLISHER: "1.8.1"
      SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      - run: |
          curl -fsSL --retry 4 -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v$PUBLISHER/mcp-publisher_linux_amd64.tar.gz"
          echo "$SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher validate
      # npm takes some minutes to show a version it has just accepted, and the registry asks npm for it: wait until
      # it answers (ten minutes at most), and sign in only then, the token being short-lived
      - if: needs.check.outputs.publish == 'public'
        run: |
          version=$(python3 -c "import json; print(json.load(open('server.json'))['packages'][0]['version'])")
          for _ in $(seq 60); do
            curl -fsS -o /dev/null "https://registry.npmjs.org/rowstile/$version" && break
            sleep 10
          done
          ./mcp-publisher login github-oidc && ./mcp-publisher publish
