# Publishes a version (RELEASING.md): set it with `python3 packaging/version.py X.Y.Z` (or X.Y.Z-alpha.N,
# X.Y.Z-beta.N, X.Y.Z-rc.N), commit,
# push the tag vX.Y.Z. A -dev version (main between releases) is refused. Where it goes follows the repository:
#   - public: PyPI and npm (trusted publishing: no token; npm with provenance), the image on ghcr.io
#   - private: the @rowstile/* packages on GitHub Packages' npm registry, a private image; the public steps as
#     dry runs. PyPI and npm have no private side, so the wheel, the sdist and the unscoped launcher (a
#     tarball) are on the GitHub release
# Either way the GitHub release holds the wheel, the sdist, the launcher and the editor extension (.vsix), and once
# public their provenance (.intoto.jsonl); the docs site is site.yml's (GitHub Pages). An alpha, a beta or a release candidate is npm's `next` and a pre-release on
# GitHub, and never the image's `latest`. While no final release exists it becomes npm's `latest` too, so a plain
# install gets the newest (packaging/npm_latest.py); once one exists, only a release is `latest`. A patch to an
# older line (release-X.Y) moves no `latest`. A release that stopped half-way is finished by running its jobs
# again: what is published already is skipped.
# Run by hand (workflow_dispatch), it builds and checks everything and publishes nothing. With latest=true it does
# one thing instead, from main: npm's `latest` goes where `next` is, for a release whose own run couldn't move it
#   gh workflow run release.yml -f latest=true
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      latest: {description: "only move npm's latest to where next is (publishes nothing)", type: boolean, default: false}

# what a job needs beyond reading the repository, it says itself
permissions: {contents: read}

jobs:
  check:
    if: ${{ !inputs.latest }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      npm-tag: ${{ steps.v.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {fetch-depth: 0}     # the unit tests check the Zed extension's grammar commit is in the history
      - id: v
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          version=$(python3 packaging/version.py)   # fails when two files disagree
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "the tag is $GITHUB_REF_NAME, the version $version"; exit 1; }
            case "$version" in *-dev) echo "$version is main between releases: it is never published"; exit 1;; esac
            # its notes: CHANGELOG.md has its section, and nothing is left under Unreleased
            python3 packaging/changelog.py --tagged "$version" > /dev/null
            if [ "$PRIVATE" = true ]; then publish=private; else publish=public; fi
          else
            publish=none
          fi
          # next for an alpha, a beta or a candidate, latest for the highest release, release-X.Y for a patch to an older line
          tag=$(python3 packaging/version.py --dist-tag)
          echo "version $version: publish $publish, npm tag $tag"
          { echo "version=$version"; echo "publish=$publish"; echo "npm-tag=$tag"; } >> "$GITHUB_OUTPUT"
      - run: python3 core/tests/unit_test.py
      # the lock CI's packaging job holds: both build the image under one name on a machine they share
      - run: flock /tmp/rowstile-ci-packaging.lock bash packaging/test.sh

  pypi:
    needs: check
    if: needs.check.outputs.publish == 'public'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    environment: pypi
    permissions: {id-token: write, contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884   # v10.3.0
        with: {version: "0.12.21"}
      - run: uv build --out-dir pypi-dist sdk/python
      # a file PyPI has already is skipped: a release that stopped half-way is finished by running it again
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33   # release/v1
        with: {packages-dir: pypi-dist, skip-existing: true}

  npm:
    needs: check
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    # npm trusts this workflow only in the environment `npm` (each package's trusted publisher names it), which
    # takes v* tags, and main for the `latest` job; a dry run, on a branch, publishes nothing and goes without it
    environment: ${{ needs.check.outputs.publish == 'public' && 'npm' || '' }}
    permissions: {id-token: write, contents: read, packages: write}
    env:
      PUBLISH: ${{ needs.check.outputs.publish }}
      TAG: ${{ needs.check.outputs.npm-tag }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: "24"
          registry-url: ${{ needs.check.outputs.publish == 'public' && 'https://registry.npmjs.org' || 'https://npm.pkg.github.com' }}
          scope: "@rowstile"
      # moving a tag by trusted publishing needs a newer npm than Node 24 brings (11.21.0 or newer), checked by its hash
      - run: bash packaging/npm/install_npm.sh
      - run: node packaging/npm/build.mjs --all
      - run: npm ci --no-audit --no-fund && npx tsc -b sdk/typescript
      # each SDK package ships its own README (in its folder: its page on npm) and the licence
      - run: for d in sdk/typescript/*/; do cp LICENSE "$d"; done
      # every package as the public publish would send it, the launcher too
      - run: for d in packaging/npm/out/cli-* packaging/npm/out/rowstile sdk/typescript/*/; do npm publish --dry-run --tag "$TAG" --access public "$d"; done
      # npmjs.com trusts this workflow (each package's trusted publisher: rowstile/rowstile, release.yml, npm): npm
      # trades the job's OIDC token for one publish, from npm 11.5.1 on. GitHub Packages (private) takes GITHUB_TOKEN.
      # A package npm doesn't have yet can't have a trusted publisher: its first publish takes a token, the
      # environment's secret NPM_TOKEN (npm falls back to it); delete the secret once the trusted publishers are set
      - if: env.PUBLISH != 'none'
        env:
          NODE_AUTH_TOKEN: ${{ needs.check.outputs.publish == 'private' && secrets.GITHUB_TOKEN || secrets.NPM_TOKEN || '' }}
        run: |
          if [ "$PUBLISH" = public ] && ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"; then
            echo "::error::trusted publishing needs npm 11.5.1 or newer, this is $(npm --version)"; exit 1
          fi
          flags=(--tag "$TAG")
          if [ "$PUBLISH" = public ]; then flags+=(--provenance --access public); fi
          # a version the registry has already is skipped (it refuses it a second time): a release that stopped
          # half-way is finished by running this job again
          publish() {
            local name; name=$(node -p "require('./$1/package.json').name")
            if [ "$(npm view "$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "$name@$VERSION is published already"
            else
              npm publish "${flags[@]}" "$1"
            fi
          }
          # the platforms first: rowstile names them as optional dependencies
          for d in packaging/npm/out/cli-*; do publish "$d"; done
          # GitHub Packages takes scoped names only: while private, the launcher is on the GitHub release
          if [ "$PUBLISH" = public ]; then publish packaging/npm/out/rowstile; fi
          for d in sdk/typescript/*/; do publish "$d"; done
      # while no final release exists, a plain install gets the newest pre-release: npm's latest goes where next is, once
      # the registry shows this version there (minutes after the publish: read sooner, nothing looks left to
      # move). Each package's trusted publisher must allow it (Allow npm dist-tag); where one doesn't, or the
      # registry is too late, this says which and the release stands. The `latest` job does it again by hand
      - if: env.PUBLISH == 'public'
        continue-on-error: true
        env: {NODE_AUTH_TOKEN: ""}
        run: python3 packaging/npm_latest.py --move --published "$VERSION"

  # By hand, with latest=true, and alone: npm's latest goes where next is on every package, for a release whose
  # own run couldn't move it. It publishes nothing. From main, which the environment `npm` takes for this
  latest:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.latest }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    environment: npm
    permissions: {id-token: write, contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with: {node-version: "24", registry-url: "https://registry.npmjs.org"}
      - run: bash packaging/npm/install_npm.sh
      - env: {NODE_AUTH_TOKEN: ""}
        run: python3 packaging/npm_latest.py --move

  image:
    needs: check
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions: {packages: write, contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - if: needs.check.outputs.publish != 'none'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f   # v4.6.0
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          push: ${{ needs.check.outputs.publish != 'none' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/rowstile:${{ needs.check.outputs.version }}
            ${{ needs.check.outputs.npm-tag == 'latest' && format('ghcr.io/{0}/rowstile:latest', github.repository_owner) || '' }}

  # the files a user can download: the wheel and sdist (PyPI's dry run: twine check), the launcher, the extension.
  # Built here, with no right to write or sign anything; github-release signs and publishes them
  release-files:
    needs: check
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions: {contents: read}
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884   # v10.3.0
        with: {version: "0.12.21"}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with: {node-version: "24"}
      # uv writes a .gitignore into the folder it builds into: not a file to download (0.1.0-alpha.1 had it)
      - run: uv build --out-dir dist sdk/python && rm -f dist/.gitignore && uvx twine check --strict dist/*
      - run: |
          node packaging/npm/build.mjs && npm pack --pack-destination dist packaging/npm/out/rowstile
          mv "dist/rowstile-$VERSION.tgz" "dist/rowstile-npm-$VERSION.tgz"   # not to be taken for the sdist
      # the extension starts the language server with vscode-languageclient: the .vsix carries it (package.json's
      # files lists node_modules; vsce keeps the production dependencies only)
      - run: cp LICENSE editor/ && cd editor && npm ci --omit=dev --no-audit --no-fund && npx --yes @vscode/vsce@3.9.2 package --out ../dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with: {name: release-files, path: dist/}
      # the notes github-release takes, written in a dry run too
      - run: python3 packaging/changelog.py "$VERSION" > /dev/null

  # the GitHub release: the files above, their provenance, the notes. It runs none of the packages' code
  github-release:
    needs: [check, release-files]
    if: needs.check.outputs.publish != 'none'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    # id-token and attestations: the files' provenance (below)
    permissions: {contents: write, id-token: write, attestations: write}
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with: {name: release-files, path: dist/}
      # the files' provenance: where and how they were built (SLSA, signed through Sigstore as this workflow), kept
      # by GitHub and attached beside them as rowstile-<version>.intoto.jsonl. `gh attestation verify FILE --repo
      # rowstile/rowstile` checks a file against it (docs/installing.md). GitHub keeps attestations for public
      # repositories only
      - if: needs.check.outputs.publish == 'public'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6   # v4.2.2
        with: {subject-path: "dist/*"}
      - if: needs.check.outputs.publish == 'public'
        env: {BUNDLE: "${{ steps.attest.outputs.bundle-path }}"}
        run: cp "$BUNDLE" "dist/rowstile-$VERSION.intoto.jsonl"
      # the notes are the release's section of CHANGELOG.md
      - run: python3 packaging/changelog.py "$VERSION" > release-notes.md
      # an action, not the GitHub CLI: a self-hosted runner may not have it
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64   # v3.0.3
        with:
          tag_name: v${{ env.VERSION }}
          name: rowstile ${{ env.VERSION }}
          files: dist/*
          body_path: release-notes.md
          prerelease: ${{ needs.check.outputs.npm-tag == 'next' }}
          fail_on_unmatched_files: true

  # the VS Code extension on the Marketplace and Open VSX, when its own version (editor/package.json, raised when
  # the extension changes) isn't there yet. Their tokens are the environment vscode's, which takes v* tags only; a
  # dry run, on a branch, packages it and goes without them
  vscode:
    needs: check
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    environment: ${{ needs.check.outputs.publish == 'public' && 'vscode' || '' }}
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with: {node-version: "24"}
      - run: cp LICENSE editor/ && cd editor && npm ci --omit=dev --no-audit --no-fund && npx --yes @vscode/vsce@3.9.2 package --out ../rowstile.vsix
      - if: needs.check.outputs.publish == 'public'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          version=$(node -p "require('./editor/package.json').version")
          # a registry whose token isn't set is skipped, said in the run's summary
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::VSCE_PAT isn't set (environment vscode): not published on the VS Code Marketplace"
          # vsce show prints "undefined" for an extension the Marketplace doesn't have
          elif npx --yes @vscode/vsce@3.9.2 show rowstile.rowstile --json | node -e '
            let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              let versions = []; try { versions = JSON.parse(s).versions.map((v) => v.version) } catch {}
              process.exit(versions.includes(process.argv[1]) ? 0 : 1)
            })' "$version"; then
            echo "the Marketplace has rowstile.rowstile $version already"
          else
            npx --yes @vscode/vsce@3.9.2 publish --packagePath rowstile.vsix
          fi
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT isn't set (environment vscode): not published on Open VSX"
          elif curl -sf "https://open-vsx.org/api/rowstile/rowstile/$version" > /dev/null; then
            echo "Open VSX has rowstile.rowstile $version already"
          else
            npx --yes ovsx@1.2.0 publish rowstile.vsix
          fi

  # The MCP server's entry in the official registry (registry.modelcontextprotocol.io): server.json, which names
  # the npm package. The registry reads `mcpName` in the package of that version, so this follows the npm job. It
  # believes this workflow's own token for names under io.github.rowstile/, so there is no secret. A dry run
  # checks the file and publishes nothing. The registry is a preview and may change or be away: this job never
  # fails a release (run it again once the registry answers).
  mcp:
    needs: [check, npm]
    runs-on: ubuntu-latest            # the publisher below is the one built for x64
    continue-on-error: true
    permissions: {id-token: write, contents: read}
    env:
      PUBLISHER: "1.8.1"
      SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - run: |
          curl -fsSL --retry 4 -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v$PUBLISHER/mcp-publisher_linux_amd64.tar.gz"
          echo "$SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher validate
      # npm takes some minutes to show a version it has just accepted, and the registry asks npm for it: wait until
      # it answers (ten minutes at most), and sign in only then, the token being short-lived
      - if: needs.check.outputs.publish == 'public'
        run: |
          version=$(python3 -c "import json; print(json.load(open('server.json'))['packages'][0]['version'])")
          for _ in $(seq 60); do
            curl -fsS -o /dev/null "https://registry.npmjs.org/rowstile/$version" && break
            sleep 10
          done
          ./mcp-publisher login github-oidc && ./mcp-publisher publish
