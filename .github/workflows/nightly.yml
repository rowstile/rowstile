# What ci.yml leaves out of each push, every night on main: every suite on PostgreSQL 17 and 18 (ci.yml runs
# them all on 16, and only what depends on the version on 17 and 18), with upgrades from every release (each push:
# from the release before), the race and stress tests on each, the random checks long with a new seed (soak), the
# SDKs' conformance suites on 17 and 18, the third evaluator on more policies (third), each statement of
# rowstile's PL/pgSQL the suites run (statements), and the scale benchmark last.
# On GitHub's runners, as ci.yml (or the one the repository variable RUNNER names). Run by hand too
# (workflow_dispatch), all of it or one job: `gh workflow run nightly.yml -f only=bench`. And several soaks at
# once, each on a runner and with a seed of its own: `gh workflow run nightly.yml -f only=soak -f soaks=7`. And every
# small policy at once, seven jobs side by side (each night's soak checks a seventh): `-f only=small`.
name: nightly
on:
  schedule:
    - cron: "0 0 * * *"       # midnight UTC (GitHub starts scheduled runs late, by minutes to hours)
  workflow_dispatch:
    inputs:
      only:
        description: "Run only this job (suites, proofs, soak, small, conformance, third, statements, bench); empty: all of them"
        default: ""
      soaks:
        description: "How many soaks to run at once (1 to 9), each with its own seed, on 16, 17 and 18 in turn"
        default: "1"
# One nightly at a time. Several soaks asked for by hand are a run of their own beside it: each is on its own runner;
# so are the small policies asked for alone
concurrency:
  group: ${{ (inputs.soaks > 1 || inputs.only == 'small') && format('soaks-{0}', github.run_id) || 'nightly' }}
  cancel-in-progress: false
# what a job needs beyond reading the repository, it says itself
permissions: {contents: read}
jobs:
  # in the parts run_tests.sh names, side by side, as ci.yml runs them
  suites:
    if: ${{ !inputs.only || inputs.only == 'suites' }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    env:
      # the label on this job's containers: its run, attempt, job, version and part
      ROWSTILE_CI_JOB: "${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.pg }}-${{ matrix.part }}"
    strategy:
      fail-fast: false
      matrix:
        pg: ["17", "18"]
        part: [unit, policy, command, random]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      # (the part command upgrades from every release on PyPI, not only the one before: core/tests/upgrade.sh --every)
      - run: bash core/ci.sh ${{ matrix.pg }}
        env: {ROWSTILE_CI_LOGS: "${{ runner.temp }}", ROWSTILE_PART: "${{ matrix.part }}", ROWSTILE_UPGRADES: every}
      # a cancelled job may stop before ci.sh removes its container: this job's own (the label names the job)
      - if: always()
        run: docker ps -aq --filter "label=rowstile.ci=$ROWSTILE_CI_JOB" | xargs -r docker rm -f -v
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: suites-pg${{ matrix.pg }}-${{ matrix.part }}
          path: ${{ runner.temp }}/rowstile-ci-${{ matrix.pg }}.log
  proofs:
    if: ${{ !inputs.only || inputs.only == 'proofs' }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    env:
      # the label on this job's containers: its run, attempt, job and version
      ROWSTILE_CI_JOB: "${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.pg }}"
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17", "18"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - run: bash core/ci.sh --proofs ${{ matrix.pg }}
        env: {ROWSTILE_CI_LOGS: "${{ runner.temp }}"}
      - if: always()
        run: docker ps -aq --filter "label=rowstile.ci=$ROWSTILE_CI_JOB" | xargs -r docker rm -f -v
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: proofs-pg${{ matrix.pg }}
          path: ${{ runner.temp }}/rowstile-ci-${{ matrix.pg }}.log
  # Which soaks this run makes: one a night, on one version in turn, with the run's id as its seed. Asked for
  # by hand (soaks), several: each with a seed of its own (the run's id and its number), on 16, 17 and 18 in turn.
  soak-plan:
    if: ${{ !inputs.only || inputs.only == 'soak' }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    outputs:
      soaks: ${{ steps.plan.outputs.soaks }}
    steps:
      - id: plan
        run: |
          case "${SOAKS:-1}" in [1-9]) ;; *) echo "soaks: a number from 1 to 9, not '$SOAKS'"; exit 1;; esac
          # (and the seventh of the small policies each checks: the day's, a week covering them all; with several,
          # one each: seven soaks check them all, as after a change to the language)
          if [ "${SOAKS:-1}" = 1 ]; then
            plan="{\"name\": \"soak\", \"pg\": $(( 16 + 10#$(date -u +%j) % 3 )), \"seed\": $GITHUB_RUN_ID, \"slice\": $(( $(date -u +%s) / 86400 % 7 ))}"
          else
            plan=$(for n in $(seq 1 "$SOAKS"); do
              echo "{\"name\": \"soak-$n\", \"pg\": $(( 16 + n % 3 )), \"seed\": $(( GITHUB_RUN_ID * 10 + n )), \"slice\": $(( (n - 1) % 7 ))}"
            done | paste -sd, -)
          fi
          echo "soaks=[$plan]" | tee -a "$GITHUB_OUTPUT"
        env: {SOAKS: "${{ inputs.soaks }}"}
  # The random checks (the parser fuzzer, every random-change run, random policies, races and stress), long and
  # with a new seed, so each night tries new cases. The log is kept either way: it says the seed, to run a
  # failure again. Each soak in the parts run_tests.sh names, side by side, on one version and with one seed:
  # the night's soak is over when its longest part is. And a seventh of the small policies (tests/small.py),
  # the day's: a week checks them all.
  soak:
    needs: soak-plan
    name: ${{ matrix.soak.name }} (${{ matrix.soak.pg }}, ${{ matrix.part }})
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      max-parallel: 8   # (several soaks asked for at once: pull requests keep runners)
      matrix:
        soak: ${{ fromJSON(needs.soak-plan.outputs.soaks) }}
        part: [changes-1, changes-2, policies, around, small, races]
    env:
      ROWSTILE_CI_JOB: "${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.soak.name }}-${{ matrix.part }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - run: |
          echo "PostgreSQL $PG, seed $SOAK_SEED, part $ROWSTILE_PART"
          bash core/ci.sh --soak "$PG"
        env:
          ROWSTILE_CI_LOGS: "${{ runner.temp }}"
          SOAK_SEED: "${{ matrix.soak.seed }}"
          SMALL_SLICE: "${{ matrix.soak.slice }}"
          PG: "${{ matrix.soak.pg }}"
          ROWSTILE_PART: "${{ matrix.part }}"
      - if: always()
        run: docker ps -aq --filter "label=rowstile.ci=$ROWSTILE_CI_JOB" | xargs -r docker rm -f -v
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: ${{ matrix.soak.name }}-${{ matrix.part }}
          path: ${{ runner.temp }}/rowstile-ci-*.log
  # Every small policy (tests/small.py), asked for by hand: the seven slices the nightly soaks check one a night, a job
  # each, side by side (as after a change to the language: `gh workflow run nightly.yml -f only=small`)
  small:
    if: ${{ inputs.only == 'small' }}
    name: small policies (slice ${{ matrix.slice }} of 7)
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        slice: [0, 1, 2, 3, 4, 5, 6]
    env:
      ROWSTILE_CI_JOB: "${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.slice }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - run: bash core/ci.sh --soak 16
        env:
          ROWSTILE_CI_LOGS: "${{ runner.temp }}"
          ROWSTILE_PART: small
          SMALL_SLICE: "${{ matrix.slice }}"
      - if: always()
        run: docker ps -aq --filter "label=rowstile.ci=$ROWSTILE_CI_JOB" | xargs -r docker rm -f -v
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: small-${{ matrix.slice }}
          path: ${{ runner.temp }}/rowstile-ci-*.log
  # The SDKs' conformance suites on 17 and 18 (ci.yml runs them on 16), and on 16 with the app through PgBouncer in
  # transaction mode (integrations/pooler.sh), one after the other: on a self-hosted runner each holds the lock its
  # CI job holds (one container name and port for the machine)
  conformance:
    if: ${{ !inputs.only || inputs.only == 'conformance' }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pg: ["17", "18"]
        pooler: [""]
        include:
          - {pg: "16", pooler: "pgbouncer"}
    env:
      PG_MAJOR: ${{ matrix.pg }}
      POOLER: ${{ matrix.pooler }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7   # v10.2.0
        with: {version: "0.12.21"}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
        with: {node-version: "24"}
      - run: flock /tmp/rowstile-ci-conformance-python.lock bash integrations/fastapi/test.sh
      - run: npm ci --no-audit --no-fund
      - run: flock /tmp/rowstile-ci-conformance-typescript.lock bash integrations/nextjs/test.sh
  # The third evaluator (core/tests/third.py, written apart from the reference evaluator, reading policies through the
  # editors' grammar) against the reference evaluator, in four parts side by side: each 250 of genpolicy's policies,
  # new seeds each night (from the run's id), and a quarter of core/tests/small.py's set up to size 5 where it is
  # there (editor/test.sh --third; each push: the repository's policies and the hand cases). Then the grammar and the
  # parser on a quarter of small.py's whole set, each policy written two ways (editor/test.sh --agree; each push: up
  # to size 4)
  third:
    if: ${{ !inputs.only || inputs.only == 'third' }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - run: >-
          bash editor/test.sh --third "--gen 250 --seed $(( ${{ github.run_id }} % 1000000 * 1000 + ${{ matrix.part }} * 250 ))
          --small 5 --slice ${{ matrix.part }}/4 --no-hand --no-repository"
      - if: ${{ !cancelled() }}
        run: bash editor/test.sh --agree "--small 6 --slice ${{ matrix.part }}/4"
  # Each statement and branch of rowstile's PL/pgSQL the suites run, on 16: core/ci.sh --statements preloads
  # plpgsql_check's profiler (in the coverage image only; rowstile needs no extension) and keeps its counts, in the
  # parts run_tests.sh names, side by side. The counts are kept when a check fails too: they are worth reading then
  statements:
    if: ${{ !inputs.only || inputs.only == 'statements' }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    env:
      # the label on this job's containers: its run, attempt, job and part
      ROWSTILE_CI_JOB: "${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.part }}"
    strategy:
      fail-fast: false
      matrix:
        part: [unit, policy, command, random]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - run: bash core/ci.sh --statements 16
        env: {ROWSTILE_CI_LOGS: "${{ runner.temp }}", ROWSTILE_PART: "${{ matrix.part }}"}
      - if: always()
        run: docker ps -aq --filter "label=rowstile.ci=$ROWSTILE_CI_JOB" | xargs -r docker rm -f -v
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: statements-logs-${{ matrix.part }}
          path: ${{ runner.temp }}/rowstile-ci-16.log
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: statements-pg16-${{ matrix.part }}
          path: |
            .ci/coverage-16/.coverage
            .ci/coverage-16/functions.tsv
            .ci/coverage-16/plpgsql.jsonl
            .ci/coverage-16/plpgsql-memory.txt
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  # What no suite runs of rowstile's PL/pgSQL, every part's counts together (core/tests/coverage_report.py: each RAISE
  # never run first, then the other statements and the branches, by kind of function; report.txt in the artifact)
  statements-report:
    needs: statements
    if: ${{ !cancelled() && (!inputs.only || inputs.only == 'statements') }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with: {pattern: "statements-pg16-*", path: .ci/parts}
      - run: docker build -q -t rowstile:16-coverage --build-arg PG_MAJOR=16 --build-arg COVERAGE=1 -f core/Dockerfile .
      - run: >-
          docker run --rm -v "$PWD:/src" -w /src/core --entrypoint bash rowstile:16-coverage
          -c "python3 tests/coverage_report.py --out /src/.ci/statements /src/.ci/parts/statements-pg16-*/.coverage"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: statements
          path: .ci/statements/report.txt
          if-no-files-found: ignore
  # The scale benchmark, small: fails when a measure got more than twice as slow as the runners' baseline
  # (recorded on the first run and kept in the cache; delete the cache entries to record it again, after an
  # intended change or on other runners), when a write fails, or when verify() doesn't say true. The gate's
  # speed limits are shown, not judged: they are for its size on a machine of its own. See core/bench/regress.sh.
  # Last, once the others are done: on a self-hosted runner, timings need the machine to themselves.
  bench:
    if: ${{ !cancelled() && (!inputs.only || inputs.only == 'bench') }}
    needs: [suites, proofs, soak, conformance, statements]
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: core/bench/baseline-ci.txt
          key: bench-baseline-${{ github.sha }}
          restore-keys: bench-baseline-
      - run: BASELINE=core/bench/baseline-ci.txt flock /tmp/rowstile-ci-bench.lock bash core/bench/regress.sh
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: core/bench/baseline-ci.txt
          key: bench-baseline-${{ github.sha }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: bench
          path: core/bench/results/regress-latest.txt
