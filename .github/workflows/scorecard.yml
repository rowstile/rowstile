# The OpenSSF Scorecard: what an outside reader checks first about how a project is run (actions pinned by commit,
# what each workflow's token may do, known vulnerabilities in what it depends on, fuzzing, review, releases).
# Every Monday, on each push to main, and by hand. The score is published at scorecard.dev (the README's badge
# reads it); each check's reason is also in the run's files (scorecard.json), and what a check finds is listed
# under Security, Code scanning.
# Publishing has its rules: GitHub's own Ubuntu runner, no steps but these actions, no `env`, and `id-token: write`
# in this job only.
name: scorecard
on:
  schedule:
    - cron: "30 5 * * 1"       # Mondays, 05:30 UTC
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: scorecard
  cancel-in-progress: true
# what a job needs beyond reading the repository, it says itself
permissions: {contents: read}
jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # security-events: the findings' list; id-token: the proof, to scorecard.dev, that this run made the result
    permissions: {contents: read, actions: read, security-events: write, id-token: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: {persist-credentials: false}
      # twice: each check's reason is easiest read from the JSON, and Code scanning only takes SARIF (the run
      # that is published)
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e   # v2.5.0
        with: {results_file: scorecard.json, results_format: json, publish_results: false}
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e   # v2.5.0
        with: {results_file: scorecard.sarif, results_format: sarif, publish_results: true}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with: {name: scorecard, path: "scorecard.*", retention-days: 30}
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370   # v4.39.1
        with: {sarif_file: scorecard.sarif}
