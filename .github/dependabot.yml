# Updates to what the repository's own tools, apps and tests use: grouped, monthly, a week after each release.
# The SDKs' dependency ranges (sdk/python/pyproject.toml, peerDependencies, the Java SDK's POMs, the crate's and
# the gem's) are what users may run with, not versions to bump, so only lock files and workflows are updated: npm
# keeps every package.json as written (the root is the workspace of the SDK's packages too), and a new major
# (TypeScript, Vite, Vitest, the VS Code extension's `@types/vscode`, which follows its `engines.vscode`) is a
# change made on purpose, by hand. Every lock file in the repository is in an entry here but the Go SDK's (below;
# a unit test checks).
# Not here: the Python the npm packages bring (python-build-standalone, packaging/npm/build.mjs), which
# RELEASING.md's release steps check.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/review-ci/github"]
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    groups:
      actions: {patterns: ["*"]}

  - package-ecosystem: npm
    directories: ["/", "/playground", "/site", "/examples/filemanager/frontend", "/examples/messenger/frontend",
                  "/editor", "/editor/publish", "/editor/tree-sitter-authz",
                  "/sdk/typescript/vitest/types-test/vitest-4", "/sdk/typescript/vitest/types-test/vitest-5"]
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    versioning-strategy: lockfile-only
    groups:
      npm: {patterns: ["*"]}

  # the base images, pinned by digest (tag@sha256): a new digest of the same tag, or a patch release (uv, VHS). A new
  # minor or major (Python 3.14, Node 26, Postgres 19) is a change made on purpose. In core/Dockerfile, a new digest
  # is the newest patch release of that Postgres major: the suites run on what users get
  - package-ecosystem: docker
    directories: ["/core", "/demo", "/examples/filemanager/backend", "/examples/messenger/backend", "/packaging/docker",
                  "/packaging/machines", "/editor/images", "/integrations/images"]
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker: {patterns: ["*"]}

  # the services the examples' compose files pull (RustFS, beside the file manager), pinned by digest the same way;
  # the rowstile image there is built from the repository
  - package-ecosystem: docker-compose
    directories: ["/examples/filemanager"]
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    ignore:
      - dependency-name: "rowstile"
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      compose: {patterns: ["*"]}

  # the Go conformance app's modules (its go.sum is its lock file); the Go SDK's own go.mod names the oldest pgx it
  # takes, which users may run with, not a version to bump
  - package-ecosystem: gomod
    directories: ["/integrations/go"]
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    groups:
      gomod: {patterns: ["*"]}

  # Atheris, for the nightly fuzz job, pinned by its wheels' hashes (core/tests/fuzz-requirements.txt)
  - package-ecosystem: pip
    directory: /core/tests
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    groups:
      fuzz: {patterns: ["*"]}

  - package-ecosystem: uv
    directories: ["/examples/filemanager/backend", "/examples/messenger/backend", "/integrations/fastapi",
                  "/integrations/django"]
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python: {patterns: ["*"]}

  # the Java conformance apps' dependencies and plugins (Maven has no lock file: their POMs name each version)
  - package-ecosystem: maven
    directories: ["/integrations/spring", "/integrations/ktor"]
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      java: {patterns: ["*"]}

  # the Java SDK's POMs name the versions its users get (Spring Boot's list, Ktor, Exposed, Kotlin): only the plugins
  # that build it move here
  - package-ecosystem: maven
    directories: ["/sdk/java"]
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    allow:
      - dependency-name: "org.apache.maven.plugins:*"
      - dependency-name: "org.jacoco:*"
      - dependency-name: "org.jetbrains.dokka:*"
      - dependency-name: "org.sonatype.central:*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      java-build: {patterns: ["*"]}

  # the Elixir package's and the Phoenix conformance app's packages (their mix.lock); the package's mix.exs names the
  # ranges it takes, which users may run with, not versions to bump
  - package-ecosystem: mix
    directories: ["/sdk/elixir", "/integrations/phoenix"]
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    versioning-strategy: lockfile-only
    groups:
      elixir: {patterns: ["*"]}

  - package-ecosystem: composer
    directories: ["/integrations/laravel"]
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      php: {patterns: ["*"]}

  - package-ecosystem: cargo
    directories: ["/editor/zed"]
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      rust: {patterns: ["*"]}

  # the Rust crate's lock file and its conformance app's (the crate's Cargo.toml names the oldest versions it takes,
  # which users may run with, not versions to bump)
  - package-ecosystem: cargo
    directories: ["/sdk/rust", "/integrations/axum"]
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    versioning-strategy: lockfile-only
    groups:
      rust-sdk: {patterns: ["*"]}

  # the Rails conformance app's gems (its Gemfile.lock); the gem itself, by path, is this checkout's
  - package-ecosystem: bundler
    directories: ["/integrations/rails"]
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    versioning-strategy: lockfile-only
    ignore:
      - dependency-name: "rowstile"
    groups:
      ruby: {patterns: ["*"]}

  # the .NET conformance app's packages and its tool (dotnet-tools.json: dotnet-ef); the SDK's own packages come
  # from the folder its test.sh packs them into (NuGet.config), never from nuget.org
  - package-ecosystem: nuget
    directories: ["/integrations/aspnetcore"]
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    ignore:
      - dependency-name: "Rowstile*"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dotnet: {patterns: ["*"]}
