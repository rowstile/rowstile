# Updates to what the repository's own tools, apps and tests use: grouped, monthly, a week after each release.
# The SDKs' dependency ranges (sdk/python/pyproject.toml, peerDependencies) are what users may run with, not
# versions to bump, so only lock files and workflows are updated: npm keeps every package.json as written (the
# root is the workspace of the SDK's packages too), and a new major (TypeScript, Vite, Vitest, the VS Code
# extension's `@types/vscode`, which follows its `engines.vscode`) is a change made on purpose, by hand.
# Not here: the Python the npm packages bring (python-build-standalone, packaging/npm/build.mjs), which
# RELEASING.md's release steps check.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/review-ci/github"]
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    groups:
      actions: {patterns: ["*"]}

  - package-ecosystem: npm
    directories: ["/", "/playground", "/site", "/examples/filemanager/frontend", "/examples/messenger/frontend",
                  "/editor", "/editor/tree-sitter-authz",
                  "/sdk/typescript/vitest/types-test/vitest-4", "/sdk/typescript/vitest/types-test/vitest-5"]
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    versioning-strategy: lockfile-only
    groups:
      npm: {patterns: ["*"]}

  # the base images, pinned by digest (tag@sha256): a new digest of the same tag, or a patch release (uv, VHS). A new
  # minor or major (Python 3.14, Node 26, Postgres 19) is a change made on purpose. In core/Dockerfile, a new digest
  # is the newest patch release of that Postgres major: the suites run on what users get
  - package-ecosystem: docker
    directories: ["/core", "/demo", "/examples/filemanager/backend", "/examples/messenger/backend", "/packaging/docker",
                  "/packaging/machines"]
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker: {patterns: ["*"]}

  # the services the examples' compose files pull (RustFS, beside the file manager), pinned by digest the same way;
  # the rowstile image there is built from the repository
  - package-ecosystem: docker-compose
    directories: ["/examples/filemanager"]
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    ignore:
      - dependency-name: "rowstile"
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      compose: {patterns: ["*"]}

  # Atheris, for the nightly fuzz job, pinned by its wheels' hashes (core/tests/fuzz-requirements.txt)
  - package-ecosystem: pip
    directory: /core/tests
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    groups:
      fuzz: {patterns: ["*"]}

  - package-ecosystem: uv
    directories: ["/examples/filemanager/backend", "/examples/messenger/backend", "/integrations/fastapi"]
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python: {patterns: ["*"]}

  - package-ecosystem: cargo
    directory: /editor/zed
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      rust: {patterns: ["*"]}
