[project]
name = "rowstile"
dynamic = ["version"]
description = "Authorization for Postgres apps: access rules compiled to row-level security. The rowstile command, and the SDK for Python apps (FastAPI, SQLAlchemy, psycopg, asyncpg, Alembic, pytest)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "postgres", "postgresql", "authorization", "row-level-security", "rls", "permissions", "access-control",
    "rbac", "rebac", "multi-tenant", "fastapi", "sqlalchemy", "alembic", "django",
]
# no licence classifier: `license` is an SPDX expression, and the two don't go together
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: FastAPI",
    "Framework :: Pytest",
    "Topic :: Database",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://rowstile.dev"
Documentation = "https://rowstile.dev/getting-started"
Repository = "https://github.com/rowstile/rowstile"
Changelog = "https://rowstile.dev/changelog"
Issues = "https://github.com/rowstile/rowstile/issues"

[project.optional-dependencies]
# each floor is the conformance app's too (integrations/fastapi; django's, integrations/django), which runs on them each
# night (RESOLUTION=lowest-direct)
fastapi = ["fastapi>=0.110", "sqlalchemy[asyncio]>=2.0"]
sqlalchemy = ["sqlalchemy>=2.0"]
# with its own libpq: psycopg alone can't be imported where the system has none (Windows)
psycopg = ["psycopg[binary]>=3.1.4"]
asyncpg = ["asyncpg>=0.29"]
# a preview: Django 5.2 (LTS) or newer, on psycopg 3 (Django's own floor for it)
django = ["django>=5.2", "psycopg[binary]>=3.1.8"]

[project.scripts]
rowstile = "rowstile.command:main"

[project.entry-points.pytest11]
rowstile = "rowstile.testing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# the version is written once, in the compiler (core/authzlib/__init__.py): _version.py reads it
[tool.hatch.version]
source = "code"
path = "rowstile/_version.py"

# hatch_build.py puts the command (core/authzlib and core/cli, standard library only) inside the
# package, rowstile/_command, so nothing of it is importable at the top level but rowstile
[tool.hatch.build.targets.wheel]
packages = ["rowstile"]
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.targets.sdist]
include = ["rowstile", "README.md", "LICENSE", "hatch_build.py"]
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.hooks.custom]

# strongly typed, as the repository's Python (ty.toml): checked in the FastAPI conformance app's environment,
# which installs this package with every extra (uv sync --project integrations/fastapi first)
#   uvx ty@0.0.56 check --project sdk/python
[tool.ty.environment]
python-version = "3.11"
python = "../../integrations/fastapi/.venv"

# the Django module needs Django, which that environment hasn't: it is checked in the Django conformance app's
#   uvx ty@0.0.56 check --project integrations/django integrations/django sdk/python/rowstile/django
[tool.ty.src]
exclude = ["rowstile/django"]

[tool.ty.rules]
all = "error"
missing-override-decorator = "ignore"

# hatchling is the build's, not in that environment
[[tool.ty.overrides]]
include = ["hatch_build.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
