[package]
name = "rowstile"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.94"
description = "rowstile for Rust apps (a preview): transactions signed in, the database's refusals as typed errors"
license = "Apache-2.0"
repository = "https://github.com/rowstile/rowstile"
homepage = "https://rowstile.dev/stacks/axum"
readme = "README.md"
keywords = ["postgres", "authorization", "row-level-security", "sqlx", "axum"]
categories = ["database", "authentication", "web-programming"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

# docs.rs (once the crate is on crates.io; crates.io links to it): every module, each marked with the feature it needs
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["tokio-postgres"]
# the SDK over tokio-postgres: rowstile::pg
tokio-postgres = ["dep:tokio-postgres"]
# the SDK over sqlx's Postgres connections and transactions: rowstile::sqlx
sqlx = ["dep:sqlx"]
# Axum: a transaction signed in for each request (an extractor), and rowstile's errors answered as problem bodies
axum = ["sqlx", "dep:axum", "dep:tracing"]
# help for an app's tests: a copy of the migrated test database for each test binary, and assertions
testing = ["tokio-postgres", "dep:tokio", "dep:sha2"]

[dependencies]
serde_json = "1.0.140"
tokio-postgres = { version = "0.7.13", optional = true }
sqlx = { version = "0.9.0", optional = true, default-features = false, features = ["postgres"] }
axum = { version = "0.8.4", optional = true, default-features = false }
tracing = { version = "0.1.41", optional = true }
tokio = { version = "1.44.0", optional = true, default-features = false, features = ["rt"] }
sha2 = { version = "0.11.1", optional = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
