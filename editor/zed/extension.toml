id = "rowstile"
name = "rowstile"
description = "rowstile policies (.authz): highlighting, outline, and errors, hover, go to definition and completion from the rowstile language server"
version = "0.1.0"
schema_version = 1
authors = ["The rowstile authors"]
repository = "https://github.com/rowstile/rowstile"

# Zed fetches the grammar from git: rev is a commit that holds editor/tree-sitter-authz as it is now. After a
# change to the grammar, commit it, then set rev to that commit (unit_test.py checks they match).
[grammars.authz]
repository = "https://github.com/rowstile/rowstile"
rev = "547eca4967c99fc42a88576c161a3aca04ba69e5"
path = "editor/tree-sitter-authz"

[language_servers.rowstile]
name = "rowstile"
languages = ["Authz"]
